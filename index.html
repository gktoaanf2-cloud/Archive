<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>PAIR ARCHIVE</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.3.0/dist/dom-to-image-more.min.js"></script>

</head>

<body>

<!-- BG -->

<div
  class="bg"
  id="bg"
>

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="bg-noise"></div>

  <div class="bg-grid"></div>

</div>

<!-- HEADER -->

<header class="header">

  <div class="header-left">

    <input
      id="pairName"
      class="pair-name-input"
      placeholder="PAIR NAME"
    />

    <input
      id="pairKeyword"
      class="pair-keyword-input"
      placeholder="relationship keyword"
    />

  </div>

  <div class="header-right">

    <button
      class="header-btn"
      onclick="createStoryCard()"
    >
      NEW EVENT
    </button>

    <button
      class="header-btn"
      onclick="exportPNG()"
    >
      EXPORT
    </button>

  </div>

</header>

<!-- EXPORT BOARD -->

<div
  class="board"
  id="exportBoard"
>

  <!-- LEFT PROFILE -->

  <aside class="profile-column">

    <div class="profile-panel">

      <div
        class="profile-image"
        id="profileA"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'A')"
      />

      <input
        id="charAName"
        class="profile-name"
        placeholder="Character A"
      />

      <textarea
        id="charABio"
        class="profile-bio"
        placeholder="Character introduction"
      ></textarea>

    </div>

  </aside>

  <!-- CENTER -->

  <main class="story-board-wrap">

    <!-- TITLE -->

    <div class="board-header">

      <div
        class="board-title"
        id="boardTitle"
      >
        Pair Name
      </div>

      <div
        class="board-keyword"
        id="boardKeyword"
      >
        Relationship
      </div>

    </div>

    <!-- STORY BOARD -->

    <div
      class="story-board"
      id="storyBoard"
    ></div>

  </main>

  <!-- RIGHT PROFILE -->

  <aside class="profile-column">

    <div class="profile-panel">

      <div
        class="profile-image"
        id="profileB"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'B')"
      />

      <input
        id="charBName"
        class="profile-name"
        placeholder="Character B"
      />

      <textarea
        id="charBBio"
        class="profile-bio"
        placeholder="Character introduction"
      ></textarea>

    </div>

  </aside>

</div>

<!-- FLOATING EDITOR -->

<div
  class="editor"
  id="editor"
>

  <div class="editor-header">

    <div class="editor-label">
      STORY EVENT
    </div>

    <button
      class="close-btn"
      onclick="closeEditor()"
    >
      ×
    </button>

  </div>

  <input
    id="eventDate"
    placeholder="DATE"
  />

  <input
    id="eventTitle"
    placeholder="TITLE"
  />

  <textarea
    id="eventContent"
    placeholder="Narrative"
  ></textarea>

  <div class="editor-sub">

    <div class="range-label">
      RELATION
    </div>

    <input
      type="range"
      min="0"
      max="100"
      value="50"
      id="eventRelation"
    />

  </div>

  <input
    type="file"
    accept="image/*"
    id="eventImage"
  />

  <button
    class="complete-btn"
    onclick="saveCard()"
  >
    COMPLETE
  </button>

</div>

<!-- SETTINGS -->

<div class="settings">

  <div class="settings-title">
    VISUAL
  </div>

  <div class="color-row">

    <input
      type="color"
      value="#8ea1ff"
      onchange="setAccent(this.value)"
    />

    <input
      type="color"
      value="#63ffe9"
      onchange="setAccent2(this.value)"
    />

    <input
      type="color"
      value="#11141d"
      onchange="setPanel(this.value)"
    />

  </div>

  <input
    type="file"
    accept="image/*"
    onchange="changeBG(event)"
  />

  <div class="slider-label">
    BLUR
  </div>

  <input
    type="range"
    min="0"
    max="40"
    value="0"
    oninput="setBlur(this.value)"
  />

  <div class="slider-label">
    SCALE
  </div>

  <input
    type="range"
    min="1"
    max="2"
    step="0.01"
    value="1"
    oninput="setScale(this.value)"
  />

  <div class="slider-label">
    ROTATE
  </div>

  <input
    type="range"
    min="-180"
    max="180"
    value="0"
    oninput="setRotate(this.value)"
  />

  <div class="slider-label">
    X
  </div>

  <input
    type="range"
    min="-600"
    max="600"
    value="0"
    oninput="setPosX(this.value)"
  />

  <div class="slider-label">
    Y
  </div>

  <input
    type="range"
    min="-600"
    max="600"
    value="0"
    oninput="setPosY(this.value)"
  />

</div>

<script>

let editingIndex = null

let tempImage = ''

let state = JSON.parse(
  localStorage.getItem(
    'pairArchiveState'
  )
) || {

  pairName: '',

  pairKeyword: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  cards: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,

  posX: 0,

  posY: 0,
}

const storyBoard =
  document.getElementById(
    'storyBoard'
  )

const bgImage =
  document.getElementById(
    'bgImage'
  )

function save() {

  localStorage.setItem(
    'pairArchiveState',
    JSON.stringify(state)
  )
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.filter =
    `blur(${state.blur}px)`

  bgImage.style.transform = `
    translate(${state.posX}px, ${state.posY}px)
    scale(${state.scale + (state.blur * 0.01)})
    rotate(${state.rotate}deg)
  `
}

function render() {

  pairName.value =
    state.pairName

  pairKeyword.value =
    state.pairKeyword

  boardTitle.innerText =
    state.pairName || 'Pair Name'

  boardKeyword.innerText =
    state.pairKeyword || 'Relationship'

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  storyBoard.innerHTML = ''

  state.cards.forEach(
    (card, index) => {

      const el =
        document.createElement('div')

      el.className =
        'story-card'

      el.style.left =
        card.x + 'px'

      el.style.top =
        card.y + 'px'

      el.style.borderColor =
        getRelationColor(
          card.relation
        )

      el.innerHTML = `

        <div class="story-date">
          ${card.date || 'DATE'}
        </div>

        <div class="story-title">
          ${card.title || 'TITLE'}
        </div>

        ${
          card.image
          ? `
            <img
              src="${card.image}"
              class="story-image"
            >
          `
          : ''
        }

        <div class="story-text">
          ${
            card.content
              ? card.content.substring(0, 110)
              : 'Narrative'
          }
        </div>
      `

      el.onclick = () => {

        openEdit(index)
      }

      enableDrag(
        el,
        index
      )

      storyBoard.appendChild(el)
    }
  )

  applyBG()

  save()
}

function getRelationColor(value) {

  if (value < 30) {

    return 'rgba(255,255,255,0.08)'
  }

  if (value < 70) {

    return 'var(--accent)'
  }

  return 'var(--accent2)'
}

function createStoryCard() {

  editingIndex = null

  editor.classList.add(
    'editor-open'
  )

  eventDate.value = ''

  eventTitle.value = ''

  eventContent.value = ''

  eventRelation.value = 50

  tempImage = ''
}

function openEdit(index) {

  editingIndex = index

  const card =
    state.cards[index]

  editor.classList.add(
    'editor-open'
  )

  eventDate.value =
    card.date || ''

  eventTitle.value =
    card.title || ''

  eventContent.value =
    card.content || ''

  eventRelation.value =
    card.relation || 50

  tempImage =
    card.image || ''
}

function closeEditor() {

  editor.classList.remove(
    'editor-open'
  )
}

eventImage.onchange = e => {

  const file =
    e.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    tempImage =
      reader.result
  }

  reader.readAsDataURL(file)
}

function saveCard() {

  const payload = {

    date:
      eventDate.value,

    title:
      eventTitle.value,

    content:
      eventContent.value,

    relation:
      eventRelation.value,

    image:
      tempImage,

    x:
      60 + (state.cards.length * 30),

    y:
      60 + (state.cards.length * 30),
  }

  if (
    editingIndex === null
  ) {

    state.cards.push(
      payload
    )

  } else {

    payload.x =
      state.cards[editingIndex].x

    payload.y =
      state.cards[editingIndex].y

    state.cards[editingIndex] =
      payload
  }

  render()

  closeEditor()
}

function enableDrag(
  element,
  index
) {

  let offsetX = 0
  let offsetY = 0
  let dragging = false

  element.addEventListener(
    'mousedown',
    e => {

      dragging = true

      offsetX =
        e.clientX -
        state.cards[index].x

      offsetY =
        e.clientY -
        state.cards[index].y
    }
  )

  window.addEventListener(
    'mousemove',
    e => {

      if (!dragging) return

      state.cards[index].x =
        e.clientX - offsetX

      state.cards[index].y =
        e.clientY - offsetY

      element.style.left =
        state.cards[index].x + 'px'

      element.style.top =
        state.cards[index].y + 'px'
    }
  )

  window.addEventListener(
    'mouseup',
    () => {

      dragging = false

      save()
    }
  )
}

function uploadCharacter(
  event,
  target
) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent',
      color
    )
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent2',
      color
    )
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty(
      '--panel',
      color
    )
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setBlur(value) {

  state.blur = value

  applyBG()

  save()
}

function setScale(value) {

  state.scale = value

  applyBG()

  save()
}

function setRotate(value) {

  state.rotate = value

  applyBG()

  save()
}

function setPosX(value) {

  state.posX = value

  applyBG()

  save()
}

function setPosY(value) {

  state.posY = value

  applyBG()

  save()
}

async function exportPNG() {

  const board =
    document.getElementById(
      'exportBoard'
    )

  try {

    const dataUrl =
      await domtoimage.toPng(
        board,
        {
          quality: 1,
          bgcolor: '#07090f',
          cacheBust: true,
        }
      )

    const link =
      document.createElement('a')

    link.download =
      `${state.pairName || 'pair'}.png`

    link.href =
      dataUrl

    link.click()

  } catch(err) {

    console.error(err)

    alert(
      'PNG export failed'
    )
  }
}

pairName.oninput = e => {

  state.pairName =
    e.target.value

  render()
}

pairKeyword.oninput = e => {

  state.pairKeyword =
    e.target.value

  render()
}

charAName.oninput = e => {

  state.charAName =
    e.target.value

  save()
}

charABio.oninput = e => {

  state.charABio =
    e.target.value

  save()
}

charBName.oninput = e => {

  state.charBName =
    e.target.value

  save()
}

charBBio.oninput = e => {

  state.charBBio =
    e.target.value

  save()
}

render()

</script>

</body>
</html>
