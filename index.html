<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.3.0/dist/dom-to-image-more.min.js"></script>

</head>

<body>

<!-- BG -->

<div class="bg">

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="bg-noise"></div>

  <div class="bg-line"></div>

</div>

<!-- APP -->

<div class="app">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="top-left">

      <input
        id="pairName"
        class="pair-input"
        placeholder="PAIR NAME"
      />

      <input
        id="pairTag"
        class="tag-input"
        placeholder="relationship keyword"
      />

    </div>

    <div class="top-right">

      <button
        class="minimal-btn"
        onclick="addChapter()"
      >
        CHAPTER
      </button>

      <button
        class="minimal-btn"
        onclick="addTimeline()"
      >
        EPISODE
      </button>

      <button
        class="minimal-btn"
        onclick="exportPNG()"
      >
        PNG
      </button>

      <button
        class="minimal-btn"
        onclick="saveProject()"
      >
        SAVE
      </button>

    </div>

  </div>

  <!-- BOARD -->

  <div
    class="board"
    id="exportBoard"
  >

    <!-- CHARACTER A -->

    <aside class="character-side">

      <div class="character-panel">

        <div
          class="profile-image"
          id="profileA"
        ></div>

        <input
          type="file"
          accept="image/*"
          onchange="uploadCharacter(event, 'A')"
        />

        <input
          id="charAName"
          class="character-name"
          placeholder="Character A"
        />

        <textarea
          id="charABio"
          class="character-bio"
          placeholder="Character introduction"
        ></textarea>

      </div>

    </aside>

    <!-- TIMELINE -->

    <main class="timeline-section">

      <div class="timeline-header">

        <div>

          <div
            class="render-pair"
            id="pairRender"
          >
            Pair Name
          </div>

          <div
            class="render-tag"
            id="tagRender"
          >
            Relationship
          </div>

        </div>

      </div>

      <!-- RELATION -->

      <div class="relation-box">

        <canvas
          id="relationCanvas"
          width="900"
          height="140"
        ></canvas>

      </div>

      <!-- TIMELINE -->

      <div
        class="timeline"
        id="timeline"
      ></div>

    </main>

    <!-- CHARACTER B -->

    <aside class="character-side">

      <div class="character-panel">

        <div
          class="profile-image"
          id="profileB"
        ></div>

        <input
          type="file"
          accept="image/*"
          onchange="uploadCharacter(event, 'B')"
        />

        <input
          id="charBName"
          class="character-name"
          placeholder="Character B"
        />

        <textarea
          id="charBBio"
          class="character-bio"
          placeholder="Character introduction"
        ></textarea>

      </div>

    </aside>

  </div>

  <!-- SETTINGS -->

  <div class="floating-settings">

    <div class="setting-group">

      <input
        type="color"
        value="#91a2ff"
        onchange="setAccent(this.value)"
      />

      <input
        type="color"
        value="#63ffe9"
        onchange="setAccent2(this.value)"
      />

      <input
        type="color"
        value="#141824"
        onchange="setPanel(this.value)"
      />

    </div>

    <input
      type="file"
      accept="image/*"
      onchange="changeBG(event)"
    />

  </div>

</div>

<script>

let state = JSON.parse(
  localStorage.getItem('pairArchiveData')
) || {

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  timelines: [],

  bg: '',
}

const timelineEl =
  document.getElementById('timeline')

const bgImage =
  document.getElementById('bgImage')

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )
}

function render() {

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  pairRender.innerText =
    state.pairName || 'Pair Name'

  tagRender.innerText =
    state.pairTag || 'Relationship'

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  timelineEl.innerHTML = ''

  state.timelines.forEach((item, index) => {

    const row =
      document.createElement('div')

    if (item.type === 'chapter') {

      row.className =
        'chapter'

      row.innerHTML = `

        <input
          class="chapter-input"
          placeholder="CHAPTER"
          value="${item.title || ''}"
          onchange="updateTimeline(${index}, 'title', this.value)"
        >
      `

    } else {

      row.className =
        'timeline-row'

      row.innerHTML = `

        <div class="timeline-left">

          <div class="timeline-dot"></div>

          <div class="timeline-date">
            ${item.date || 'DATE'}
          </div>

        </div>

        <div class="timeline-card">

          <input
            class="timeline-title"
            placeholder="Episode title"
            value="${item.title || ''}"
            onchange="updateTimeline(${index}, 'title', this.value)"
          >

          <textarea
            class="story-area"
            placeholder="Narrative"
            oninput="autoResize(this)"
            onchange="updateTimeline(${index}, 'content', this.value)"
          >${item.content || ''}</textarea>

          ${
            item.image
            ? `
              <img
                src="${item.image}"
                class="episode-image"
              >
            `
            : ''
          }

          <div class="timeline-bottom">

            <input
              class="date-input"
              placeholder="DATE"
              value="${item.date || ''}"
              onchange="updateTimeline(${index}, 'date', this.value)"
            >

            <input
              type="range"
              min="0"
              max="100"
              value="${item.relation || 50}"
              onchange="updateTimeline(${index}, 'relation', this.value)"
            >

            <input
              type="file"
              accept="image/*"
              onchange="timelineImage(event, ${index})"
            >

          </div>

        </div>
      `
    }

    timelineEl.appendChild(row)
  })

  renderGraph()

  save()
}

function autoResize(el) {

  el.style.height = 'auto'

  el.style.height =
    el.scrollHeight + 'px'
}

function addTimeline() {

  state.timelines.push({

    type: 'episode',

    title: '',

    content: '',

    date: '',

    relation: 50,

    image: '',
  })

  render()
}

function addChapter() {

  state.timelines.push({

    type: 'chapter',

    title: '',
  })

  render()
}

function updateTimeline(index, key, value) {

  state.timelines[index][key] =
    value

  renderGraph()

  save()
}

function uploadCharacter(event, target) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function timelineImage(event, index) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.timelines[index].image =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty('--accent', color)
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty('--accent2', color)
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty('--panel', color)
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

async function exportPNG() {

  const board =
    document.getElementById(
      'exportBoard'
    )

  try {

    const dataUrl =
      await domtoimage.toPng(
        board,
        {
          quality: 1,
          bgcolor: 'transparent'
        }
      )

    const link =
      document.createElement('a')

    link.download =
      `${state.pairName || 'pair'}.png`

    link.href =
      dataUrl

    link.click()

  } catch (err) {

    alert(
      'PNG export failed.'
    )

    console.error(err)
  }
}

function renderGraph() {

  const canvas =
    document.getElementById(
      'relationCanvas'
    )

  const ctx =
    canvas.getContext('2d')

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  )

  const episodes =
    state.timelines.filter(
      t => t.type === 'episode'
    )

  ctx.strokeStyle =
    '#91a2ff'

  ctx.lineWidth = 2

  ctx.beginPath()

  episodes.forEach((item, index) => {

    const x =
      60 + index * 110

    const y =
      120 - item.relation

    if (index === 0) {

      ctx.moveTo(x, y)

    } else {

      ctx.lineTo(x, y)
    }
  })

  ctx.stroke()

  episodes.forEach((item, index) => {

    const x =
      60 + index * 110

    const y =
      120 - item.relation

    ctx.beginPath()

    ctx.fillStyle =
      '#ffffff'

    ctx.arc(
      x,
      y,
      4,
      0,
      Math.PI * 2
    )

    ctx.fill()
  })
}

pairName.oninput = e => {

  state.pairName =
    e.target.value

  render()
}

pairTag.oninput = e => {

  state.pairTag =
    e.target.value

  render()
}

charAName.oninput = e => {

  state.charAName =
    e.target.value

  save()
}

charABio.oninput = e => {

  state.charABio =
    e.target.value

  save()
}

charBName.oninput = e => {

  state.charBName =
    e.target.value

  save()
}

charBBio.oninput = e => {

  state.charBBio =
    e.target.value

  save()
}

function saveProject() {

  save()

  alert('saved')
}

new Sortable(
  timelineEl,
  {
    animation: 160,

    onEnd: function(evt) {

      const moved =
        state.timelines.splice(
          evt.oldIndex,
          1
        )[0]

      state.timelines.splice(
        evt.newIndex,
        0,
        moved
      )

      renderGraph()

      save()
    }
  }
)

render()

</script>

</body>
</html>
