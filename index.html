<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.3.0/dist/dom-to-image-more.min.js"></script>

</head>

<body>

<!-- BG -->

<div
  class="bg-layer"
  id="bgLayer"
>

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="bg-grid"></div>

  <div class="bg-noise"></div>

</div>

<!-- APP -->

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-left">

      <input
        id="pairName"
        class="pair-name-input"
        placeholder="PAIR NAME"
      />

      <input
        id="pairTag"
        class="pair-tag-input"
        placeholder="relationship keyword"
      />

    </div>

    <div class="header-right">

      <button
        class="ghost-btn"
        onclick="addCard()"
      >
        ADD CARD
      </button>

      <button
        class="ghost-btn"
        onclick="addChapter()"
      >
        ADD CHAPTER
      </button>

      <button
        class="ghost-btn"
        onclick="exportPNG()"
      >
        PNG
      </button>

    </div>

  </header>

  <!-- EXPORT BOARD -->

  <div
    class="export-board"
    id="exportBoard"
  >

    <!-- LEFT CHARACTER -->

    <aside class="character-panel">

      <div
        class="character-image"
        id="profileA"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'A')"
      />

      <input
        id="charAName"
        class="character-name"
        placeholder="Character A"
      />

      <textarea
        id="charABio"
        class="character-bio"
        placeholder="Character introduction"
      ></textarea>

    </aside>

    <!-- CENTER -->

    <main class="story-map-wrap">

      <div class="story-map-header">

        <div
          class="pair-render"
          id="pairRender"
        >
          Pair Name
        </div>

        <div
          class="tag-render"
          id="tagRender"
        >
          Relationship
        </div>

      </div>

      <!-- STORY MAP -->

      <div
        class="story-map"
        id="storyMap"
      ></div>

      <!-- EDIT PANEL -->

      <div class="edit-panel">

        <div class="edit-top">

          <div class="edit-title">
            CARD EDITOR
          </div>

          <div
            class="selected-indicator"
            id="selectedIndicator"
          >
            no card selected
          </div>

        </div>

        <input
          id="editDate"
          placeholder="DATE"
        />

        <input
          id="editTitle"
          placeholder="TITLE"
        />

        <textarea
          id="editContent"
          placeholder="Narrative"
        ></textarea>

        <input
          type="range"
          id="editRelation"
          min="0"
          max="100"
        />

        <input
          type="file"
          accept="image/*"
          id="editImage"
        />

      </div>

    </main>

    <!-- RIGHT CHARACTER -->

    <aside class="character-panel">

      <div
        class="character-image"
        id="profileB"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'B')"
      />

      <input
        id="charBName"
        class="character-name"
        placeholder="Character B"
      />

      <textarea
        id="charBBio"
        class="character-bio"
        placeholder="Character introduction"
      ></textarea>

    </aside>

  </div>

  <!-- SETTINGS -->

  <div class="floating-panel">

    <div class="floating-title">
      THEME
    </div>

    <div class="color-row">

      <input
        type="color"
        value="#91a2ff"
        onchange="setAccent(this.value)"
      />

      <input
        type="color"
        value="#63ffe9"
        onchange="setAccent2(this.value)"
      />

      <input
        type="color"
        value="#161c2b"
        onchange="setPanel(this.value)"
      />

    </div>

    <input
      type="file"
      accept="image/*"
      onchange="changeBG(event)"
    />

    <div class="slider-label">
      BLUR
    </div>

    <input
      type="range"
      min="0"
      max="40"
      value="0"
      oninput="setBlur(this.value)"
    />

    <div class="slider-label">
      SCALE
    </div>

    <input
      type="range"
      min="1"
      max="2"
      step="0.01"
      value="1"
      oninput="setScale(this.value)"
    />

    <div class="slider-label">
      ROTATE
    </div>

    <input
      type="range"
      min="-180"
      max="180"
      value="0"
      oninput="setRotate(this.value)"
    />

    <div class="slider-label">
      X
    </div>

    <input
      type="range"
      min="-500"
      max="500"
      value="0"
      oninput="setPosX(this.value)"
    />

    <div class="slider-label">
      Y
    </div>

    <input
      type="range"
      min="-500"
      max="500"
      value="0"
      oninput="setPosY(this.value)"
    />

  </div>

</div>

<script>

let selectedCard = null

let state = JSON.parse(
  localStorage.getItem('pairArchiveData')
) || {

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  cards: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,

  posX: 0,

  posY: 0,
}

const storyMap =
  document.getElementById('storyMap')

const bgImage =
  document.getElementById('bgImage')

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.filter =
    `blur(${state.blur}px)`

  bgImage.style.transform = `
    translate(${state.posX}px, ${state.posY}px)
    scale(${state.scale + (state.blur * 0.01)})
    rotate(${state.rotate}deg)
  `
}

function render() {

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  pairRender.innerText =
    state.pairName || 'Pair Name'

  tagRender.innerText =
    state.pairTag || 'Relationship'

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  storyMap.innerHTML = ''

  state.cards.forEach((card, index) => {

    const el =
      document.createElement('div')

    el.className =
      card.type === 'chapter'
      ? 'chapter-card'
      : 'story-card'

    if (selectedCard === index) {

      el.classList.add(
        'selected-card'
      )
    }

    if (card.type === 'chapter') {

      el.innerHTML = `
        <div class="chapter-name">
          ${card.title || 'CHAPTER'}
        </div>
      `

    } else {

      el.innerHTML = `

        <div class="story-date">
          ${card.date || 'DATE'}
        </div>

        <div class="story-title">
          ${card.title || 'TITLE'}
        </div>

        <div class="story-preview">
          ${
            card.content
            ? card.content.substring(0, 80)
            : 'Narrative'
          }
        </div>

        ${
          card.image
          ? `
            <img
              src="${card.image}"
              class="story-thumb"
            >
          `
          : ''
        }
      `
    }

    el.onclick = () => {

      selectCard(index)
    }

    storyMap.appendChild(el)
  })

  applyBG()

  renderGraph()

  save()
}

function addCard() {

  state.cards.push({

    type: 'story',

    date: '',

    title: '',

    content: '',

    relation: 50,

    image: '',
  })

  render()
}

function addChapter() {

  state.cards.push({

    type: 'chapter',

    title: '',
  })

  render()
}

function selectCard(index) {

  selectedCard = index

  const card =
    state.cards[index]

  selectedIndicator.innerText =
    card.title || 'untitled'

  editDate.value =
    card.date || ''

  editTitle.value =
    card.title || ''

  editContent.value =
    card.content || ''

  editRelation.value =
    card.relation || 50

  render()
}

function updateSelectedCard() {

  if (
    selectedCard === null
  ) return

  const card =
    state.cards[selectedCard]

  card.date =
    editDate.value

  card.title =
    editTitle.value

  card.content =
    editContent.value

  card.relation =
    editRelation.value

  render()
}

editDate.oninput =
updateSelectedCard

editTitle.oninput =
updateSelectedCard

editContent.oninput =
updateSelectedCard

editRelation.oninput =
updateSelectedCard

editImage.onchange = e => {

  if (
    selectedCard === null
  ) return

  const file =
    e.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.cards[selectedCard].image =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function uploadCharacter(event, target) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent',
      color
    )
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent2',
      color
    )
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty(
      '--panel',
      color
    )
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setBlur(value) {

  state.blur = value

  applyBG()

  save()
}

function setScale(value) {

  state.scale = value

  applyBG()

  save()
}

function setRotate(value) {

  state.rotate = value

  applyBG()

  save()
}

function setPosX(value) {

  state.posX = value

  applyBG()

  save()
}

function setPosY(value) {

  state.posY = value

  applyBG()

  save()
}

async function exportPNG() {

  const board =
    document.getElementById(
      'exportBoard'
    )

  const wrapper =
    document.createElement('div')

  wrapper.style.position =
    'fixed'

  wrapper.style.left =
    '-99999px'

  wrapper.style.top =
    '0'

  wrapper.style.width =
    board.offsetWidth + 'px'

  wrapper.style.height =
    board.offsetHeight + 'px'

  wrapper.style.background =
    '#070b14'

  const bgClone =
    bgLayer.cloneNode(true)

  const boardClone =
    board.cloneNode(true)

  wrapper.appendChild(bgClone)

  wrapper.appendChild(boardClone)

  document.body.appendChild(
    wrapper
  )

  try {

    const dataUrl =
      await domtoimage.toPng(
        wrapper,
        {
          quality: 1,
          cacheBust: true,
        }
      )

    const link =
      document.createElement('a')

    link.download =
      `${state.pairName || 'pair'}.png`

    link.href =
      dataUrl

    link.click()

  } catch(err) {

    alert(
      'PNG export failed'
    )

    console.error(err)
  }

  document.body.removeChild(
    wrapper
  )
}

function renderGraph() {}

pairName.oninput = e => {

  state.pairName =
    e.target.value

  render()
}

pairTag.oninput = e => {

  state.pairTag =
    e.target.value

  render()
}

charAName.oninput = e => {

  state.charAName =
    e.target.value

  save()
}

charABio.oninput = e => {

  state.charABio =
    e.target.value

  save()
}

charBName.oninput = e => {

  state.charBName =
    e.target.value

  save()
}

charBBio.oninput = e => {

  state.charBBio =
    e.target.value

  save()
}

new Sortable(
  storyMap,
  {
    animation: 160,

    onEnd: function(evt) {

      const moved =
        state.cards.splice(
          evt.oldIndex,
          1
        )[0]

      state.cards.splice(
        evt.newIndex,
        0,
        moved
      )

      render()
    }
  }
)

render()

</script>

</body>
</html>
