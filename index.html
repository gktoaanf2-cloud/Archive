<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>

<body>

<!-- BG -->

<div class="bg">

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="grid"></div>

  <div class="noise"></div>

</div>

<!-- APP -->

<div class="app">

  <!-- SIDE -->

  <aside class="sidebar">

    <div class="sidebar-inner">

      <div class="logo-box">

        <div class="logo-circle"></div>

        <div>

          <div class="tiny-label">
            PAIR ARCHIVE
          </div>

          <div class="logo-title">
            Narrative
          </div>

        </div>

      </div>

      <!-- PROJECT -->

      <div class="block">

        <div class="block-title">
          PROJECT
        </div>

        <input
          id="projectName"
          placeholder="프로젝트"
        />

        <button
          class="line-btn"
          onclick="saveProject()"
        >
          SAVE
        </button>

        <select
          id="projectSelect"
          onchange="loadProject(this.value)"
        ></select>

      </div>

      <!-- PAIR -->

      <div class="block">

        <div class="block-title">
          PAIR
        </div>

        <input
          id="pairName"
          placeholder="페어명"
        />

        <input
          id="pairTag"
          placeholder="관계 키워드"
        />

      </div>

      <!-- CHAR -->

      <div class="block profile-block">

        <div class="profile-top">

          <div
            class="profile"
            id="profileA"
          ></div>

          <div class="profile-info">

            <div class="profile-name">
              Character A
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'A')"
            />

          </div>

        </div>

        <input
          id="charAName"
          placeholder="이름"
        />

        <textarea
          id="charABio"
          placeholder="소개"
        ></textarea>

      </div>

      <div class="block profile-block">

        <div class="profile-top">

          <div
            class="profile"
            id="profileB"
          ></div>

          <div class="profile-info">

            <div class="profile-name">
              Character B
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'B')"
            />

          </div>

        </div>

        <input
          id="charBName"
          placeholder="이름"
        />

        <textarea
          id="charBBio"
          placeholder="소개"
        ></textarea>

      </div>

      <!-- EXPORT -->

      <div class="block">

        <div class="block-title">
          EXPORT
        </div>

        <button
          class="line-btn"
          onclick="exportPNG()"
        >
          PNG EXPORT
        </button>

        <button
          class="line-btn"
          onclick="exportTXT()"
        >
          TXT EXPORT
        </button>

        <input
          type="file"
          accept=".txt"
          onchange="importTXT(event)"
        />

      </div>

      <!-- THEME -->

      <div class="block">

        <div class="block-title">
          THEME
        </div>

        <div class="color-grid">

          <input
            type="color"
            value="#91a2ff"
            onchange="setAccent(this.value)"
          />

          <input
            type="color"
            value="#63ffe9"
            onchange="setAccent2(this.value)"
          />

          <input
            type="color"
            value="#101726"
            onchange="setPanel(this.value)"
          />

        </div>

        <input
          type="file"
          accept="image/*"
          onchange="changeBG(event)"
        />

      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <!-- EXPORT BOARD -->

    <div
      class="board"
      id="exportBoard"
    >

      <!-- TOP -->

      <div class="board-top">

        <div>

          <div class="tiny-label">
            STORY TIMELINE
          </div>

          <h1 class="board-title">
            Narrative Flow
          </h1>

        </div>

        <div class="board-meta">

          <div id="pairTitleRender">
            Pair
          </div>

          <div id="pairTagRender">
            Relationship
          </div>

        </div>

      </div>

      <!-- RELATION -->

      <div class="relation-panel">

        <canvas
          id="relationCanvas"
          width="1200"
          height="180"
        ></canvas>

      </div>

      <!-- TIMELINE -->

      <div
        class="timeline"
        id="timeline"
      ></div>

    </div>

    <!-- FLOAT BUTTON -->

    <div class="floating-buttons">

      <button
        class="circle-btn"
        onclick="addChapter()"
      >
        +
      </button>

      <button
        class="circle-btn"
        onclick="addTimeline()"
      >
        ●
      </button>

    </div>

  </main>

</div>

<script>

let state = JSON.parse(
  localStorage.getItem('pairArchiveData')
) || {

  projectName: '',

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  timelines: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,

  posX: 0,

  posY: 0,
}

const timelineEl =
  document.getElementById('timeline')

const bgImage =
  document.getElementById('bgImage')

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )

  renderProjectList()
}

function renderProjectList() {

  const select =
    document.getElementById('projectSelect')

  select.innerHTML = ''

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  projects.forEach(project => {

    const option =
      document.createElement('option')

    option.value =
      project.projectName

    option.innerText =
      project.projectName

    select.appendChild(option)
  })
}

function saveProject() {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const filtered =
    projects.filter(
      p =>
      p.projectName !==
      state.projectName
    )

  filtered.push(state)

  localStorage.setItem(
    'pairProjects',
    JSON.stringify(filtered)
  )

  renderProjectList()
}

function loadProject(name) {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const found =
    projects.find(
      p => p.projectName === name
    )

  if (!found) return

  state = found

  render()
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.transform = `
    translate(${state.posX}px, ${state.posY}px)
    scale(${state.scale})
    rotate(${state.rotate}deg)
  `
}

function render() {

  projectName.value =
    state.projectName

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  pairTitleRender.innerText =
    state.pairName || 'Pair'

  pairTagRender.innerText =
    state.pairTag || 'Relationship'

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  timelineEl.innerHTML = ''

  state.timelines.forEach((item, index) => {

    const node =
      document.createElement('div')

    if (item.type === 'chapter') {

      node.className =
        'chapter-row'

      node.innerHTML = `

        <div class="chapter-line"></div>

        <input
          class="chapter-input"
          placeholder="CHAPTER"
          value="${item.title || ''}"
          onchange="updateTimeline(${index}, 'title', this.value)"
        >
      `

    } else {

      node.className =
        'timeline-row'

      node.innerHTML = `

        <div class="timeline-left">

          <div class="timeline-dot"></div>

          <div class="timeline-date">
            ${item.date || 'DATE'}
          </div>

        </div>

        <div class="timeline-card">

          <div class="timeline-head">

            <input
              class="timeline-title"
              placeholder="에피소드 제목"
              value="${item.title || ''}"
              onchange="updateTimeline(${index}, 'title', this.value)"
            >

            <input
              class="timeline-date-input"
              placeholder="날짜"
              value="${item.date || ''}"
              onchange="updateTimeline(${index}, 'date', this.value)"
            >

          </div>

          <textarea
            class="compact-area"
            placeholder="서사 입력"
            oninput="autoResize(this)"
            onchange="updateTimeline(${index}, 'content', this.value)"
          >${item.content || ''}</textarea>

          <div class="timeline-bottom">

            <input
              type="range"
              min="0"
              max="100"
              value="${item.relation || 50}"
              onchange="updateTimeline(${index}, 'relation', this.value)"
            >

            <input
              type="file"
              accept="image/*"
              onchange="timelineImage(event, ${index})"
            >

          </div>

          ${
            item.image
            ? `
              <img
                src="${item.image}"
                class="episode-image"
              >
            `
            : ''
          }

        </div>
      `
    }

    timelineEl.appendChild(node)
  })

  applyBG()

  renderGraph()

  save()
}

function autoResize(el) {

  el.style.height = 'auto'

  el.style.height =
    el.scrollHeight + 'px'
}

function addTimeline() {

  state.timelines.push({

    type: 'episode',

    date: '',

    title: '',

    content: '',

    relation: 50,

    image: '',
  })

  render()
}

function addChapter() {

  state.timelines.push({

    type: 'chapter',

    title: '',
  })

  render()
}

function updateTimeline(index, key, value) {

  state.timelines[index][key] =
    value

  renderGraph()

  save()
}

function uploadCharacter(event, target) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function timelineImage(event, index) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.timelines[index].image =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty('--accent', color)
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty('--accent2', color)
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty('--panelSolid', color)
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function exportTXT() {

  const text =
    JSON.stringify(state, null, 2)

  const blob =
    new Blob(
      [text],
      {
        type: 'text/plain'
      }
    )

  const a =
    document.createElement('a')

  a.href =
    URL.createObjectURL(blob)

  a.download =
    `${state.projectName || 'pair'}.txt`

  a.click()
}

function importTXT(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state =
      JSON.parse(reader.result)

    render()
  }

  reader.readAsText(file)
}

async function exportPNG() {

  const board =
    document.getElementById(
      'exportBoard'
    )

  const clone =
    board.cloneNode(true)

  clone.style.width = '1400px'

  clone.style.position = 'absolute'

  clone.style.left = '-99999px'

  clone.style.top = '0'

  clone.style.padding = '60px'

  document.body.appendChild(clone)

  const canvas =
    await html2canvas(
      clone,
      {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
      }
    )

  document.body.removeChild(clone)

  const link =
    document.createElement('a')

  link.download =
    `${state.projectName || 'pair'}.png`

  link.href =
    canvas.toDataURL('image/png')

  link.click()
}

function renderGraph() {

  const canvas =
    document.getElementById(
      'relationCanvas'
    )

  const ctx =
    canvas.getContext('2d')

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  )

  const episodes =
    state.timelines.filter(
      t => t.type === 'episode'
    )

  ctx.strokeStyle =
    '#91a2ff'

  ctx.lineWidth = 2

  ctx.beginPath()

  episodes.forEach((item, index) => {

    const x =
      80 + index * 120

    const y =
      150 - item.relation

    if (index === 0) {

      ctx.moveTo(x, y)

    } else {

      ctx.lineTo(x, y)
    }
  })

  ctx.stroke()

  episodes.forEach((item, index) => {

    const x =
      80 + index * 120

    const y =
      150 - item.relation

    ctx.beginPath()

    ctx.fillStyle =
      '#ffffff'

    ctx.arc(
      x,
      y,
      4,
      0,
      Math.PI * 2
    )

    ctx.fill()
  })
}

projectName.oninput = e => {
  state.projectName = e.target.value
  save()
}

pairName.oninput = e => {
  state.pairName = e.target.value
  save()
}

pairTag.oninput = e => {
  state.pairTag = e.target.value
  save()
}

charAName.oninput = e => {
  state.charAName = e.target.value
  save()
}

charABio.oninput = e => {
  state.charABio = e.target.value
  save()
}

charBName.oninput = e => {
  state.charBName = e.target.value
  save()
}

charBBio.oninput = e => {
  state.charBBio = e.target.value
  save()
}

new Sortable(
  timelineEl,
  {
    animation: 160,

    onEnd: function(evt) {

      const moved =
        state.timelines.splice(
          evt.oldIndex,
          1
        )[0]

      state.timelines.splice(
        evt.newIndex,
        0,
        moved
      )

      renderGraph()

      save()
    }
  }
)

renderProjectList()

render()

</script>

</body>
</html>
