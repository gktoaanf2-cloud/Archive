<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC CHRONICLE SYSTEM // v1.0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #030509;
            --panel: rgba(13, 17, 26, 0.75);
            --accent: #8ea1ff;
            --accent-rgb: 142, 161, 255;
            --sub-accent: #63ffe9;
            --text: #edf2ff;
            --muted: rgba(237, 242, 255, 0.45);
            --line: rgba(142, 161, 255, 0.15);
            --card-bg: rgba(20, 25, 38, 0.85);
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; outline: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* --- Interactive Background Layer --- */
        #viewport {
            position: fixed; inset: 0; z-index: -1;
            overflow: hidden; perspective: 1000px;
        }
        #bg-canvas {
            position: absolute; inset: -50%;
            width: 200%; height: 200%;
            background-size: cover; background-position: center;
            transform-origin: center;
            transition: filter 0.3s ease;
        }
        .bg-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent, var(--bg) 90%);
            z-index: -1; pointer-events: none;
        }
        .bg-grid {
            position: fixed; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1; opacity: 0.2; pointer-events: none;
        }

        /* --- Layout --- */
        #app-container {
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            height: 100vh; position: relative; z-index: 10;
        }

        /* --- Profile Column --- */
        .side-panel {
            background: rgba(3, 5, 9, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--line);
            padding: 30px; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }
        .side-panel::-webkit-scrollbar { width: 4px; }
        .side-panel::-webkit-scrollbar-thumb { background: var(--accent); }

        .system-label {
            font-size: 10px; letter-spacing: 0.2em; color: var(--accent);
            text-transform: uppercase; margin-bottom: 5px; opacity: 0.8;
        }

        .char-card {
            background: var(--card-bg); border: 1px solid var(--line);
            border-radius: 12px; padding: 15px; position: relative;
        }
        .char-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .image-upload-zone {
            width: 100%; aspect-ratio: 4/5; background: rgba(0,0,0,0.3);
            border: 1px dashed var(--line); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; margin-bottom: 10px;
        }
        .image-upload-zone img { width: 100%; height: 100%; object-fit: cover; }

        input, textarea {
            width: 100%; background: transparent; border: 1px solid transparent;
            color: var(--text); font-family: inherit; transition: 0.2s;
        }
        input:focus, textarea:focus { border-bottom: 1px solid var(--accent); }
        .name-input { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .bio-input { font-size: 13px; line-height: 1.6; color: var(--muted); height: 100px; resize: none; }

        /* --- Center Timeline Board --- */
        #artboard {
            overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
            padding: 100px 0; position: relative;
        }
        .timeline-axis {
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 1px; background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            transform: translateX(-50%); opacity: 0.5;
        }
        .timeline-content {
            max-width: 900px; margin: 0 auto; position: relative;
            display: flex; flex-direction: column; gap: 60px;
        }

        .timeline-card {
            width: 420px; background: var(--card-bg);
            border: 1px solid var(--line); border-radius: 16px;
            padding: 25px; position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .timeline-card:nth-child(odd) { align-self: flex-start; }
        .timeline-card:nth-child(even) { align-self: flex-end; }
        
        .timeline-card::after {
            content: ''; position: absolute; top: 30px;
            width: 20px; height: 1px; background: var(--accent);
        }
        .timeline-card:nth-child(odd)::after { right: -20px; }
        .timeline-card:nth-child(even)::after { left: -20px; }

        .card-date { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
        .card-title { font-size: 22px; font-weight: 900; margin-bottom: 15px; letter-spacing: -0.02em; }
        .card-image { width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--line); }
        .card-desc { font-size: 14px; line-height: 1.8; color: var(--muted); white-space: pre-wrap; }

        /* --- Floating Editor & Tools --- */
        .tool-panel {
            background: rgba(3, 5, 9, 0.8); backdrop-filter: blur(20px);
            border-left: 1px solid var(--line); padding: 30px;
            display: flex; flex-direction: column; gap: 25px;
        }

        button {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700;
            font-size: 12px; letter-spacing: 0.1em; transition: 0.3s;
        }
        button:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4); }
        button.danger { border-color: #ff5e5e; color: #ff5e5e; }
        button.danger:hover { background: #ff5e5e; color: #fff; }

        .editor-box {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Scrollbar --- */
        #artboard::-webkit-scrollbar { width: 0px; } /* 아트보드는 스크롤바 숨김 */

        /* --- Animation --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .timeline-card { animation: fadeIn 0.6s ease forwards; }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="bg-canvas"></div>
        <div class="bg-overlay"></div>
        <div class="bg-grid"></div>
    </div>

    <div id="app-container">
        <aside class="side-panel">
            <div class="system-label">Synchronization Status</div>
            <input type="text" id="pair-name" class="name-input" placeholder="페어 코드네임" style="font-size: 24px; color: var(--accent);">
            
            <div class="system-label" style="margin-top:20px;">Character 01</div>
            <div class="char-card">
                <div class="image-upload-zone" onclick="triggerImgUpload('c1-img')">
                    <img id="c1-preview" src="" style="display:none;">
                    <span id="c1-placeholder">IMAGE UPLOAD</span>
                </div>
                <input type="file" id="c1-img" hidden onchange="handleProfileImg(this, 'c1-preview', 'c1-placeholder')">
                <input type="text" class="name-input" placeholder="NAME">
                <textarea class="bio-input" placeholder="DATA FRAGMENT..."></textarea>
            </div>

            <div class="system-label" style="margin-top:10px;">Character 02</div>
            <div class="char-card">
                <div class="image-upload-zone" onclick="triggerImgUpload('c2-img')">
                    <img id="c2-preview" src="" style="display:none;">
                    <span id="c2-placeholder">IMAGE UPLOAD</span>
                </div>
                <input type="file" id="c2-img" hidden onchange="handleProfileImg(this, 'c2-preview', 'c2-placeholder')">
                <input type="text" class="name-input" placeholder="NAME">
                <textarea class="bio-input" placeholder="DATA FRAGMENT..."></textarea>
            </div>

            <div class="system-label" style="margin-top:20px;">System Controls</div>
            <button onclick="exportImage()">IMAGE EXPORT (PNG)</button>
            <button onclick="exportTxt()">DATA BACKUP (TXT)</button>
            <button onclick="triggerTxtImport()">IMPORT DATA</button>
            <input type="file" id="import-file" hidden onchange="importTxt(event)" accept=".txt">
        </aside>

        <main id="artboard">
            <div class="timeline-axis"></div>
            <div class="timeline-content" id="timeline-list">
                </div>
        </main>

        <aside class="tool-panel">
            <div class="system-label">Event Recorder</div>
            <div class="editor-box">
                <input type="text" id="ev-date" placeholder="DATE (e.g. 2024.05.27)" class="name-input" style="font-size: 14px;">
                <input type="text" id="ev-title" placeholder="EVENT TITLE" class="name-input">
                <div class="image-upload-zone" style="aspect-ratio: 16/9;" onclick="triggerImgUpload('ev-img')">
                    <img id="ev-preview" src="" style="display:none;">
                    <span id="ev-placeholder">EVENT VISUAL</span>
                </div>
                <input type="file" id="ev-img" hidden onchange="handleProfileImg(this, 'ev-preview', 'ev-placeholder')">
                <textarea id="ev-content" class="bio-input" placeholder="DESCRIBE THE MOMENT..." style="height: 150px;"></textarea>
                <button onclick="addTimelineItem()">+ ADD TO CHRONICLE</button>
            </div>

            <div class="system-label">Visual Adjustments</div>
            <div class="editor-box">
                <div style="font-size:11px; margin-bottom:5px;">BG UPLOAD</div>
                <input type="file" onchange="setBgImage(event)" style="font-size:10px;">
                <div style="font-size:11px; margin-top:15px; margin-bottom:5px;">BLUR LEVEL</div>
                <input type="range" min="0" max="20" value="0" oninput="updateBgEffects(this.value)">
                <div style="font-size:10px; color:var(--muted); margin-top:10px; line-height:1.4;">
                    * Wheel: Zoom<br>
                    * Drag: Move<br>
                    * Shift + Wheel: Rotate
                </div>
            </div>
            <button class="danger" onclick="clearData()">SYSTEM RESET</button>
        </aside>
    </div>

    <script>
        // --- Background Interaction Logic ---
        let bgCanvas = document.getElementById('bg-canvas');
        let scale = 1, posX = 0, posY = 0, rotate = 0, blurVal = 0;
        let isDragging = false, startX, startY;

        function updateTransform() {
            bgCanvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale}) rotate(${rotate}deg)`;
        }

        window.addEventListener('mousedown', (e) => {
            if(e.target.closest('.side-panel') || e.target.closest('.tool-panel') || e.target.closest('.timeline-card')) return;
            isDragging = true; startX = e.clientX - posX; startY = e.clientY - posY;
        });
        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            posX = e.clientX - startX; posY = e.clientY - startY;
            updateTransform();
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('wheel', (e) => {
            if(e.target.closest('.side-panel') || e.target.closest('.tool-panel') || e.target.closest('#artboard')) return;
            e.preventDefault();
            if(e.shiftKey) rotate += e.deltaY * 0.1;
            else scale -= e.deltaY * 0.001;
            updateTransform();
        }, {passive: false});

        function setBgImage(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => bgCanvas.style.backgroundImage = `url(${ev.target.result})`;
                reader.readAsDataURL(file);
            }
        }
        function updateBgEffects(val) {
            bgCanvas.style.filter = `blur(${val}px) brightness(0.7)`;
        }

        // --- Logic: Timeline & Data ---
        function triggerImgUpload(id) { document.getElementById(id).click(); }

        function handleProfileImg(input, previewId, placeholderId) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(previewId).src = e.target.result;
                    document.getElementById(previewId).style.display = 'block';
                    document.getElementById(placeholderId).style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function addTimelineItem() {
            const date = document.getElementById('ev-date').value;
            const title = document.getElementById('ev-title').value;
            const content = document.getElementById('ev-content').value;
            const imgSrc = document.getElementById('ev-preview').src;
            const hasImg = document.getElementById('ev-preview').style.display !== 'none';

            if(!title) { alert("서사 제목은 필수입니다."); return; }

            const list = document.getElementById('timeline-list');
            const card = document.createElement('div');
            card.className = 'timeline-card';
            card.innerHTML = `
                <div class="card-date">${date || 'UNDATED'}</div>
                <div class="card-title">${title}</div>
                ${hasImg ? `<img src="${imgSrc}" class="card-image">` : ''}
                <div class="card-desc">${content}</div>
                <button onclick="this.parentElement.remove(); autoSave();" style="margin-top:15px; border-color:#ff5e5e; color:#ff5e5e; padding:5px 10px; font-size:10px;">DELETE</button>
            `;
            list.appendChild(card);
            autoSave();
            
            // 리셋 에디터
            document.getElementById('ev-title').value = '';
            document.getElementById('ev-content').value = '';
            document.getElementById('ev-preview').style.display = 'none';
            document.getElementById('ev-placeholder').style.display = 'block';
        }

        // --- Persistence & Export ---
        function autoSave() {
            const data = {
                pairName: document.getElementById('pair-name').value,
                profiles: Array.from(document.querySelectorAll('.side-panel .char-card')).map(c => ({
                    name: c.querySelector('.name-input').value,
                    bio: c.querySelector('.bio-input').value,
                    img: c.querySelector('img').src,
                    imgVisible: c.querySelector('img').style.display
                })),
                timeline: Array.from(document.querySelectorAll('.timeline-card')).map(c => ({
                    date: c.querySelector('.card-date').innerText,
                    title: c.querySelector('.card-title').innerText,
                    desc: c.querySelector('.card-desc').innerText,
                    img: c.querySelector('.card-image') ? c.querySelector('.card-image').src : null
                }))
            };
            localStorage.setItem('oc_chronicle_v1', JSON.stringify(data));
        }

        function loadData() {
            const raw = localStorage.getItem('oc_chronicle_v1');
            if(!raw) return;
            const data = JSON.parse(raw);
            document.getElementById('pair-name').value = data.pairName;
            
            const profCards = document.querySelectorAll('.side-panel .char-card');
            data.profiles.forEach((p, i) => {
                profCards[i].querySelector('.name-input').value = p.name;
                profCards[i].querySelector('.bio-input').value = p.bio;
                if(p.imgVisible === 'block') {
                    profCards[i].querySelector('img').src = p.img;
                    profCards[i].querySelector('img').style.display = 'block';
                    profCards[i].querySelector('span').style.display = 'none';
                }
            });

            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            data.timeline.forEach(item => {
                const card = document.createElement('div');
                card.className = 'timeline-card';
                card.innerHTML = `
                    <div class="card-date">${item.date}</div>
                    <div class="card-title">${item.title}</div>
                    ${item.img ? `<img src="${item.img}" class="card-image">` : ''}
                    <div class="card-desc">${item.desc}</div>
                    <button onclick="this.parentElement.remove(); autoSave();" style="margin-top:15px; border-color:#ff5e5e; color:#ff5e5e; padding:5px 10px; font-size:10px;">DELETE</button>
                `;
                list.appendChild(card);
            });
        }

        function exportTxt() {
            const raw = localStorage.getItem('oc_chronicle_v1');
            const blob = new Blob([raw], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `CHRONICLE_${document.getElementById('pair-name').value || 'DATA'}.txt`;
            a.click();
        }

        function triggerTxtImport() { document.getElementById('import-file').click(); }
        function importTxt(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                localStorage.setItem('oc_chronicle_v1', ev.target.result);
                loadData();
                alert("SYSTEM: DATA RECOVERY COMPLETE.");
            };
            reader.readAsText(file);
        }

        function exportImage() {
            const art = document.body;
            html2canvas(art, { backgroundColor: '#030509', useCORS: true, scale: 2 }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL("image/png");
                a.download = `ARTBOARD_${document.getElementById('pair-name').value}.png`;
                a.click();
            });
        }

        function clearData() {
            if(confirm("시스템의 모든 데이터를 소거하시겠습니까? 백업되지 않은 데이터는 복구할 수 없습니다.")) {
                localStorage.removeItem('oc_chronicle_v1');
                location.reload();
            }
        }

        document.addEventListener('input', autoSave);
        window.onload = loadData;

    </script>
</body>
</html>
