<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive System</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>

<body>

<!-- BG -->

<div class="bg">

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="grid"></div>

  <div class="radial radial-a"></div>

  <div class="radial radial-b"></div>

  <div class="diamond-overlay"></div>

</div>

<!-- APP -->

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-scroll">

      <div class="logo-wrap">

        <div class="logo-ring"></div>

        <div>

          <div class="subtitle">
            ARCHIVE SYSTEM
          </div>

          <div class="logo-title">
            Pair Archive
          </div>

        </div>

      </div>

      <!-- PROJECT -->

      <div class="panel">

        <div class="panel-title">
          PROJECT
        </div>

        <input
          id="projectName"
          placeholder="프로젝트 이름"
        />

        <button
          class="main-btn full"
          onclick="saveProject()"
        >
          프로젝트 저장
        </button>

        <select
          id="projectSelect"
          onchange="loadProject(this.value)"
        ></select>

      </div>

      <!-- PAIR -->

      <div class="panel">

        <div class="panel-title">
          PAIR INFO
        </div>

        <input
          id="pairName"
          placeholder="페어명"
        />

        <input
          id="pairTag"
          placeholder="관계 키워드"
        />

      </div>

      <!-- CHAR A -->

      <div class="panel character-card">

        <div class="character-top">

          <div
            class="profile-preview"
            id="profileA"
          ></div>

          <div>

            <div class="character-title">
              Character A
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'A')"
            />

          </div>

        </div>

        <input
          id="charAName"
          placeholder="캐릭터 이름"
        />

        <textarea
          id="charABio"
          placeholder="캐릭터 소개"
        ></textarea>

      </div>

      <!-- CHAR B -->

      <div class="panel character-card">

        <div class="character-top">

          <div
            class="profile-preview"
            id="profileB"
          ></div>

          <div>

            <div class="character-title">
              Character B
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'B')"
            />

          </div>

        </div>

        <input
          id="charBName"
          placeholder="캐릭터 이름"
        />

        <textarea
          id="charBBio"
          placeholder="캐릭터 소개"
        ></textarea>

      </div>

      <!-- EXPORT -->

      <div class="panel">

        <div class="panel-title">
          EXPORT
        </div>

        <button
          class="main-btn full"
          onclick="exportTXT()"
        >
          TXT 저장
        </button>

        <button
          class="main-btn full"
          onclick="exportPNG()"
        >
          PNG 저장
        </button>

        <input
          type="file"
          accept=".txt"
          onchange="importTXT(event)"
        />

      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main
    class="main"
    id="captureTarget"
  >

    <!-- HERO -->

    <div class="hero">

      <div>

        <div class="subtitle">
          STORY TIMELINE
        </div>

        <h1 class="title">
          Narrative Flow
        </h1>

      </div>

      <div class="hero-buttons">

        <button
          class="main-btn"
          onclick="addChapter()"
        >
          + 챕터
        </button>

        <button
          class="main-btn"
          onclick="addTimeline()"
        >
          + 에피소드
        </button>

      </div>

    </div>

    <!-- REL GRAPH -->

    <div class="relation-wrap panel">

      <div class="panel-title">
        RELATION FLOW
      </div>

      <canvas
        id="relationCanvas"
        width="1000"
        height="240"
      ></canvas>

    </div>

    <!-- TIMELINE -->

    <div
      class="timeline-wrap"
      id="timeline"
    ></div>

  </main>

  <!-- SETTINGS -->

  <aside class="settings">

    <div class="panel">

      <div class="panel-title">
        THEME
      </div>

      <div class="setting-label">
        Accent
      </div>

      <input
        type="color"
        value="#91a2ff"
        onchange="setAccent(this.value)"
      />

      <div class="setting-label">
        Accent 2
      </div>

      <input
        type="color"
        value="#63ffe9"
        onchange="setAccent2(this.value)"
      />

      <div class="setting-label">
        Panel
      </div>

      <input
        type="color"
        value="#141a2d"
        onchange="setPanel(this.value)"
      />

    </div>

    <!-- BG -->

    <div class="panel">

      <div class="panel-title">
        BACKGROUND
      </div>

      <input
        type="file"
        accept="image/*"
        onchange="changeBG(event)"
      />

      <div class="setting-label">
        Blur
      </div>

      <input
        type="range"
        min="0"
        max="40"
        value="0"
        oninput="setBlur(this.value)"
      />

      <div class="setting-label">
        Scale
      </div>

      <input
        type="range"
        min="1"
        max="2"
        step="0.01"
        value="1"
        oninput="setScale(this.value)"
      />

      <div class="setting-label">
        Rotate
      </div>

      <input
        type="range"
        min="-180"
        max="180"
        value="0"
        oninput="setRotate(this.value)"
      />

      <div class="setting-label">
        X
      </div>

      <input
        type="range"
        min="-500"
        max="500"
        value="0"
        oninput="setPosX(this.value)"
      />

      <div class="setting-label">
        Y
      </div>

      <input
        type="range"
        min="-500"
        max="500"
        value="0"
        oninput="setPosY(this.value)"
      />

    </div>

  </aside>

</div>

<script>

let state = JSON.parse(
  localStorage.getItem('pairArchiveData')
) || {

  projectName: '',

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  timelines: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,

  posX: 0,

  posY: 0,
}

const timelineEl =
  document.getElementById('timeline')

const bgImage =
  document.getElementById('bgImage')

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )

  renderProjectList()
}

function renderProjectList() {

  const select =
    document.getElementById('projectSelect')

  select.innerHTML = ''

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  projects.forEach(project => {

    const option =
      document.createElement('option')

    option.value =
      project.projectName

    option.innerText =
      project.projectName

    select.appendChild(option)
  })
}

function saveProject() {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const filtered =
    projects.filter(
      p =>
      p.projectName !==
      state.projectName
    )

  filtered.push(state)

  localStorage.setItem(
    'pairProjects',
    JSON.stringify(filtered)
  )

  renderProjectList()
}

function loadProject(name) {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const found =
    projects.find(
      p => p.projectName === name
    )

  if (!found) return

  state = found

  render()
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.filter =
    `blur(${state.blur}px)`

  bgImage.style.transform = `
    translate(${state.posX}px, ${state.posY}px)
    scale(${state.scale + (state.blur * 0.01)})
    rotate(${state.rotate}deg)
  `
}

function render() {

  projectName.value =
    state.projectName

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  timelineEl.innerHTML = ''

  state.timelines.forEach((item, index) => {

    const card =
      document.createElement('div')

    if (item.type === 'chapter') {

      card.className =
        'chapter-block'

      card.innerHTML = `

        <div class="chapter-diamond"></div>

        <input
          class="chapter-input"
          placeholder="CHAPTER"
          value="${item.title || ''}"
          onchange="updateTimeline(${index}, 'title', this.value)"
        >
      `

    } else {

      card.className =
        'timeline-node'

      card.innerHTML = `

        <div class="timeline-line"></div>

        <div class="timeline-dot"></div>

        <div class="timeline-card">

          <div class="timeline-top">

            <div class="episode-id">
              EP ${index + 1}
            </div>

            <div class="timeline-date-wrap">

              <input
                class="mini-input"
                placeholder="DATE"
                value="${item.date || ''}"
                onchange="updateTimeline(${index}, 'date', this.value)"
              >

            </div>

          </div>

          <input
            class="timeline-title"
            placeholder="에피소드 제목"
            value="${item.title || ''}"
            onchange="updateTimeline(${index}, 'title', this.value)"
          >

          <details>

            <summary>
              상세 서사 펼치기
            </summary>

            <textarea
              placeholder="서사를 입력하세요"
              onchange="updateTimeline(${index}, 'content', this.value)"
            >${item.content || ''}</textarea>

            <div class="relation-box">

              <div class="relation-label">
                관계 변화
              </div>

              <input
                type="range"
                min="0"
                max="100"
                value="${item.relation || 50}"
                onchange="updateTimeline(${index}, 'relation', this.value)"
              />

            </div>

            <input
              type="file"
              accept="image/*"
              onchange="timelineImage(event, ${index})"
            >

            ${
              item.image
              ? `
                <img
                  src="${item.image}"
                  class="image-preview"
                >
              `
              : ''
            }

          </details>

        </div>
      `
    }

    timelineEl.appendChild(card)
  })

  applyBG()

  renderGraph()

  save()
}

function addTimeline() {

  state.timelines.push({

    type: 'episode',

    date: '',

    title: '',

    content: '',

    image: '',

    relation: 50,
  })

  render()
}

function addChapter() {

  state.timelines.push({

    type: 'chapter',

    title: '',
  })

  render()
}

function updateTimeline(index, key, value) {

  state.timelines[index][key] =
    value

  renderGraph()

  save()
}

function uploadCharacter(event, target) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function timelineImage(event, index) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.timelines[index].image =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty('--accent', color)
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty('--accent2', color)
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty('--panelSolid', color)
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setBlur(value) {

  state.blur = value

  applyBG()

  save()
}

function setScale(value) {

  state.scale = value

  applyBG()

  save()
}

function setRotate(value) {

  state.rotate = value

  applyBG()

  save()
}

function setPosX(value) {

  state.posX = value

  applyBG()

  save()
}

function setPosY(value) {

  state.posY = value

  applyBG()

  save()
}

function exportTXT() {

  const text =
    JSON.stringify(state, null, 2)

  const blob =
    new Blob(
      [text],
      {
        type: 'text/plain'
      }
    )

  const a =
    document.createElement('a')

  a.href =
    URL.createObjectURL(blob)

  a.download =
    `${state.projectName || 'pair'}.txt`

  a.click()
}

function importTXT(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state =
      JSON.parse(reader.result)

    render()
  }

  reader.readAsText(file)
}

async function exportPNG() {

  document.body.classList.add(
    'export-mode'
  )

  const canvas =
    await html2canvas(
      document.getElementById(
        'captureTarget'
      ),
      {
        backgroundColor: null,
        useCORS: true,
        scale: 2
      }
    )

  document.body.classList.remove(
    'export-mode'
  )

  const link =
    document.createElement('a')

  link.download =
    `${state.projectName || 'pair'}.png`

  link.href =
    canvas.toDataURL()

  link.click()
}

function renderGraph() {

  const canvas =
    document.getElementById(
      'relationCanvas'
    )

  const ctx =
    canvas.getContext('2d')

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  )

  const episodes =
    state.timelines.filter(
      t => t.type === 'episode'
    )

  ctx.strokeStyle =
    '#91a2ff'

  ctx.lineWidth = 4

  ctx.beginPath()

  episodes.forEach((item, index) => {

    const x =
      80 + index * 120

    const y =
      200 - item.relation

    if (index === 0) {

      ctx.moveTo(x, y)

    } else {

      ctx.lineTo(x, y)
    }
  })

  ctx.stroke()

  episodes.forEach((item, index) => {

    const x =
      80 + index * 120

    const y =
      200 - item.relation

    ctx.beginPath()

    ctx.fillStyle =
      '#ffffff'

    ctx.arc(
      x,
      y,
      7,
      0,
      Math.PI * 2
    )

    ctx.fill()
  })
}

projectName.oninput = e => {
  state.projectName = e.target.value
  save()
}

pairName.oninput = e => {
  state.pairName = e.target.value
  save()
}

pairTag.oninput = e => {
  state.pairTag = e.target.value
  save()
}

charAName.oninput = e => {
  state.charAName = e.target.value
  save()
}

charABio.oninput = e => {
  state.charABio = e.target.value
  save()
}

charBName.oninput = e => {
  state.charBName = e.target.value
  save()
}

charBBio.oninput = e => {
  state.charBBio = e.target.value
  save()
}

new Sortable(
  timelineEl,
  {
    animation: 200,

    onEnd: function(evt) {

      const moved =
        state.timelines.splice(
          evt.oldIndex,
          1
        )[0]

      state.timelines.splice(
        evt.newIndex,
        0,
        moved
      )

      renderGraph()

      save()
    }
  }
)

renderProjectList()

render()

</script>

</body>
</html>
