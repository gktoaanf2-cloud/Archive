<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC CHRONICLE - V21 FINAL</title>
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style id="core-css">
        :root {
            --c-main: #d1bda0; --c-sub: #6d827c; --c-bg: #0a0b0d; 
            --panel: rgba(12, 14, 17, 0.85); --text-pri: #f0f0f0; --text-mut: rgba(255, 255, 255, 0.4);
            --line: rgba(209, 189, 160, 0.15); font-family: 'Pretendard', sans-serif;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-sub); }
        body, html { width: 100%; height: 100%; background: var(--c-bg); color: var(--text-pri); overflow: hidden; }

        .app-wrapper { display: flex; width: 100%; height: 100vh; position: relative; background-color: var(--c-bg); overflow: hidden; }
        .bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.3; z-index: 0; pointer-events: none; transition: filter 0.3s ease; }
        .bg-grid { position: absolute; inset: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.5; z-index: 1; pointer-events: none; transition: 0.3s; }
        
        .char-pillar { width: 320px; height: 100%; flex-shrink: 0; position: relative; z-index: 10; border-right: 1px solid var(--line); cursor: pointer; background: #000; }
        .char-pillar.right { border-right: none; border-left: 1px solid var(--line); }
        .pillar-img { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: grayscale(40%); transition: 0.5s; z-index: 1; }
        .char-pillar:hover .pillar-img { filter: grayscale(0%); }
        .char-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 150px 30px 40px; background: linear-gradient(to top, rgba(10,11,13,1) 0%, rgba(10,11,13,0.7) 40%, transparent 100%); display: flex; flex-direction: column; gap: 8px; z-index: 2; pointer-events: auto; }
        
        .char-input { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-pri); font-family: inherit; transition: 0.3s; padding-bottom: 5px; width: 100%; }
        .char-input:focus { border-bottom-color: var(--c-main); }
        .char-name { font-size: 24px; font-weight: 900; letter-spacing: 0.15em; color: var(--c-main); text-transform: uppercase; }
        .char-bio { font-size: 11px; line-height: 1.8; color: var(--text-mut); resize: none; height: 90px; }

        .center-board { flex: 1; height: 100%; position: relative; z-index: 5; display: flex; flex-direction: column; background: radial-gradient(circle at center, transparent 0%, rgba(10,11,13,0.8) 100%); overflow-y: auto; overflow-x: hidden; }
        
        .hud-panel { position: sticky; top: 0; width: 100%; z-index: 100; padding: 20px 40px; background: linear-gradient(to bottom, rgba(10,11,13,0.95) 0%, transparent 100%); }
        .hud-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
        .sys-title { font-size: 12px; font-weight: 900; letter-spacing: 0.4em; color: var(--text-mut); }
        .btn { background: rgba(255,255,255,0.02); border: 1px solid var(--line); color: var(--c-main); padding: 8px 16px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer; transition: 0.3s; }
        .btn:hover { border-color: var(--c-main); background: rgba(209,189,160,0.1); }
        .btn-sub { border-color: transparent; color: var(--text-mut); }
        .btn-sub:hover { color: var(--text-pri); }
        .btn-active { background: var(--c-main); color: #000; border-color: var(--c-main); }
        .btn-danger { background: rgba(255,74,74,0.1); border-color: #ff4a4a; color: #ff4a4a; }
        .btn-danger:hover { background: #ff4a4a; color: #fff; }

        .settings-bar { display: none; flex-wrap: wrap; gap: 15px; padding: 15px 0; font-size: 11px; color: var(--text-mut); }
        .settings-bar.active { display: flex; }
        .set-item { display: flex; align-items: center; gap: 8px; }
        input[type="color"] { width: 16px; height: 16px; border: none; cursor: pointer; background: transparent; padding:0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 2px; }

        .pair-header { width: 100%; padding: 80px 40px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
        .pair-input { background: transparent; border: none; text-align: center; font-family: inherit; color: var(--c-main); transition: 0.3s; width: 100%; }
        .pair-input:focus { border-bottom: 1px solid var(--c-main); background: rgba(255,255,255,0.02); }
        .pair-input::placeholder { color: var(--text-mut); opacity: 0.5; }
        .ph-title { font-size: 52px; font-weight: 900; letter-spacing: 0.15em; margin-bottom: 10px; text-transform: uppercase; }
        .ph-sub { font-size: 14px; font-weight: 300; letter-spacing: 0.4em; color: var(--text-pri); margin-bottom: 30px; }
        .ph-dday-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 15px 30px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .ph-date-input { background: transparent; border: none; color: var(--text-mut); font-family: inherit; font-size: 12px; cursor: pointer; letter-spacing: 0.1em; text-align: center; }
        .ph-date-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
        .ph-dday-text { font-size: 18px; font-weight: 900; color: var(--c-main); letter-spacing: 0.1em; }

        .timeline-container { padding: 40px 60px 100px; display: flex; flex-direction: column; flex: 1; position: relative; }
        .timeline-row { display: flex; align-items: flex-start; gap: 40px; padding: 40px 0; position: relative; width: 100%; }
        .timeline-row::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); z-index: 0; }
        .row-normal { flex-direction: row; justify-content: flex-start; }
        .row-reverse { flex-direction: row-reverse; justify-content: flex-start; }
        .has-curve::after { content: ''; position: absolute; top: 50%; width: 50px; height: 100%; border: 1px solid var(--c-sub); z-index: 0; opacity: 0.5; }
        .row-normal.has-curve::after { right: -25px; border-left: none; border-radius: 0 40px 40px 0; }
        .row-reverse.has-curve::after { left: -25px; border-right: none; border-radius: 40px 0 0 40px; }

        .story-card { width: calc(33.333% - 26px); background: var(--panel); border: 1px solid var(--line); border-top: 1px solid var(--c-main); padding: 30px 25px; position: relative; z-index: 2; transition: 0.3s ease; height: auto; backdrop-filter: blur(10px); }
        .story-card::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 8px; height: 8px; background: var(--c-bg); border: 1px solid var(--c-main); }
        .story-card:hover { border-color: var(--c-main); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; }
        
        .card-no { position: absolute; top: -12px; left: 15px; background: var(--c-bg); border: 1px solid var(--c-main); color: var(--c-main); font-size: 9px; padding: 2px 6px; font-weight: 800; letter-spacing: 0.1em; }
        .card-date { font-size: 9px; font-weight: 700; color: var(--c-sub); letter-spacing: 0.2em; margin-top: 5px; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 800; line-height: 1.4; margin-bottom: 15px; color: var(--text-pri); }
        
        .card-img-memo { position: absolute; top: -15px; right: -15px; width: 70px; height: 70px; border: 1px solid var(--line); border-top: 8px solid rgba(255,255,255,0.05); background-color: var(--c-bg); background-size: cover; background-position: center; box-shadow: 2px 5px 15px rgba(0,0,0,0.8); transform: rotate(5deg); z-index: 5; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: grayscale(20%); }
        .story-card:hover .card-img-memo { transform: rotate(0deg) scale(2) translate(-10px, 10px); z-index: 20; filter: grayscale(0%); border-top-color: var(--c-main); }
        .card-desc { font-size: 12px; line-height: 1.9; color: var(--text-mut); white-space: pre-wrap; word-break: keep-all; }
        
        .card-controls { position: absolute; bottom: 15px; right: 15px; display: flex; gap: 8px; opacity: 0; transition: 0.2s; }
        .story-card:hover .card-controls { opacity: 0.5; }
        .card-controls button { background: none; border: none; font-size: 9px; cursor: pointer; letter-spacing: 0.1em; transition: 0.2s; }
        .card-controls button:hover { opacity: 1 !important; text-decoration: underline; }
        .btn-edit { color: var(--c-main); }
        .btn-del { color: #ff5555; }

        .chapter-divider { width: 100%; display: flex; align-items: center; justify-content: center; margin: 60px 0; position: relative; z-index: 5; }
        .chapter-divider::before { content: ''; position: absolute; top: -30px; bottom: -30px; width: 1px; background: var(--line); z-index: 0; }
        
        .chapter-text-content { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; background: var(--c-bg); padding: 25px 50px; border: 1px solid var(--line); border-top: 2px solid var(--c-main); box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 220px; transition: 0.3s; }
        .chapter-text-content:hover { border-color: var(--c-main); }
        
        .ch-label { font-size: 10px; font-weight: 800; letter-spacing: 0.4em; color: var(--text-mut); margin-bottom: 5px; text-transform: uppercase; }
        .ch-number { font-size: 24px; font-weight: 900; letter-spacing: 0.1em; color: var(--c-main); margin-bottom: 12px; font-family: 'Times New Roman', serif; }
        .ch-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 5px; letter-spacing: 0.05em; }
        .ch-sub { font-size: 10px; color: var(--c-sub); letter-spacing: 0.2em; }

        .ch-controls { position: absolute; right: 10px; top: 10px; display: flex; gap: 8px; opacity: 0; transition: 0.2s; }
        .chapter-text-content:hover .ch-controls { opacity: 0.5; }
        .ch-controls button { background: none; border: none; font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .ch-controls button:hover { opacity: 1 !important; }
        .ch-del-btn { color: #ff5555; }

        .sticker { position: absolute; cursor: move; z-index: 50; background-size: contain; background-repeat: no-repeat; background-position: center; border: 1px solid transparent; transition: border 0.2s; }
        .sticker.active { border: 1px dashed var(--c-main); background-color: rgba(255,255,255,0.05); }
        .sticker-controls { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); display: none; background: rgba(0,0,0,0.8); border: 1px solid var(--c-main); padding: 4px 8px; border-radius: 4px; gap: 8px; font-size: 10px; white-space: nowrap; pointer-events: auto; }
        .sticker.active .sticker-controls { display: flex; }
        .sticker-controls button { background: none; border: none; color: white; cursor: pointer; font-size: 12px; }
        .sticker-controls button:hover { color: var(--c-main); }
        .sticker-tip { display:none; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--c-main); white-space:nowrap; }
        .sticker.active .sticker-tip { display:block; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; display: none; justify-content: center; align-items: center; }
        .editor-box { width: 400px; background: #0a0b0d; border: 1px solid var(--line); border-top: 2px solid var(--c-main); padding: 30px; display: flex; flex-direction: column; gap: 15px; }
        .editor-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-mut); font-size: 11px; font-weight: 800; cursor: pointer; letter-spacing: 0.1em; }
        .tab-btn.active { color: var(--c-main); }
        .editor-input { background: transparent; border: 1px solid var(--line); color: var(--text-pri); padding: 12px; font-family: inherit; font-size: 11px; letter-spacing: 0.05em; transition: 0.2s; }
        .editor-input:focus { border-color: var(--c-main); }
        
        .capture-mode .story-card { backdrop-filter: none !important; }
        .capture-mode .pillar-img { filter: grayscale(0%) !important; }
        .capture-mode .card-img-memo { transform: rotate(0deg) scale(1) translate(0,0) !important; filter: grayscale(0%) !important; border-top-color: var(--c-main) !important;}
        .capture-mode .sticker { border-color: transparent !important; background-color: transparent !important; }
        .capture-mode .sticker-controls, .capture-mode .sticker-tip { display: none !important; }

        .static-text-clone { white-space: pre-wrap; word-break: break-word; overflow: hidden; display: flex; }
    </style>
</head>
<body>

    <div class="app-wrapper" id="capture-area">
        <div class="bg-layer" id="bg-canvas"></div>
        <div class="bg-grid" id="bg-grid"></div>

        <aside class="char-pillar" onclick="document.getElementById('char1-upload').click()">
            <div id="char1-img" class="pillar-img"></div>
            <input type="file" id="char1-upload" hidden accept="image/*" onchange="handleImgUpload(event, 'char1-img', 'c1')">
            <div class="char-overlay" onclick="event.stopPropagation()">
                <input type="text" id="c1-name" class="char-input char-name" placeholder="CHAR 01" oninput="saveData()">
                <textarea id="c1-bio" class="char-input char-bio" placeholder="Profile & Memory..." oninput="saveData()"></textarea>
            </div>
        </aside>

        <main class="center-board" id="scroll-board">
            <div class="hud-panel" id="hud-panel" data-html2canvas-ignore="true">
                <div class="hud-top">
                    <div class="sys-title">CHRONICLE_V21</div>
                    <div style="display:flex; gap: 10px;">
                        <button class="btn btn-sub" onclick="openGuide()">📖 배포 가이드</button>
                        <button class="btn btn-sub" onclick="document.getElementById('settings-bar').classList.toggle('active')">⚙️ SETTING</button>
                        <label class="btn btn-sub" style="text-align:center;">
                            🌟 스티커 <input type="file" hidden accept="image/*" onchange="addSticker(event)">
                        </label>
                        <div style="width:1px; background:var(--line); margin: 0 5px;"></div>
                        <button class="btn" onclick="openModal('chapter')">+ 챕터 분기</button>
                        <button class="btn" onclick="openModal('story')">+ 서사 기록</button>
                        <button class="btn" style="background:var(--c-sub); color:#fff; border:none;" onclick="exportHTMLViewer()">🌐 HTML 전시관</button>
                        <button class="btn" style="background:var(--text-pri); color:#000; border:none;" onclick="exportImage()">📸 렌더링</button>
                    </div>
                </div>
                
                <div class="settings-bar" id="settings-bar">
                    <div class="set-item">MAIN <input type="color" id="theme-main" value="#d1bda0" onchange="updateColors()"></div>
                    <div class="set-item">SUB <input type="color" id="theme-sub" value="#6d827c" onchange="updateColors()"></div>
                    <div class="set-item" style="margin-left: 10px;">배경 <input type="file" style="width: 130px;" accept="image/*" onchange="handleBgUpload(event)"></div>
                    <div class="set-item">투명도 <input type="range" id="bg-opacity" min="0" max="10" value="3" style="width:50px;" oninput="updateBgStyle()"></div>
                    <div class="set-item">블러 <input type="range" id="bg-blur" min="0" max="10" value="0" style="width:50px;" oninput="updateBgStyle()"></div>
                    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
                        <button class="btn btn-sub" id="grid-toggle-btn" onclick="toggleGrid()">격자 [ON]</button>
                        <button class="btn btn-sub" id="num-style-btn" onclick="toggleNumStyle()">챕터 [01]</button>
                        <div style="width:1px; height:15px; background:var(--line);"></div>
                        <button class="btn btn-sub" onclick="exportData()">TXT 백업</button>
                        <button class="btn btn-sub" onclick="document.getElementById('import-file').click()">TXT 로드</button>
                        <input type="file" id="import-file" hidden accept=".txt" onchange="importData(event)">
                        <button class="btn btn-danger" onclick="resetAllData()">💣 리셋</button>
                    </div>
                </div>
            </div>

            <header class="pair-header">
                <input type="text" id="pair-title" class="pair-input ph-title" placeholder="ENTER PAIR NAME" oninput="saveData()">
                <input type="text" id="pair-sub" class="pair-input ph-sub" placeholder="서브 문구를 입력하세요" oninput="saveData()">
                <div class="ph-dday-wrap">
                    <input type="date" id="pair-date" class="ph-date-input" onchange="calcDday(); saveData()">
                    <span id="dday-result" class="ph-dday-text">D-DAY</span>
                </div>
            </header>

            <div class="timeline-container" id="timeline-box"></div>
            <div id="sticker-layer"></div>
        </main>

        <aside class="char-pillar right" onclick="document.getElementById('char2-upload').click()">
            <div id="char2-img" class="pillar-img"></div>
            <input type="file" id="char2-upload" hidden accept="image/*" onchange="handleImgUpload(event, 'char2-img', 'c2')">
            <div class="char-overlay" onclick="event.stopPropagation()">
                <input type="text" id="c2-name" class="char-input char-name" placeholder="CHAR 02" style="text-align: right;" oninput="saveData()">
                <textarea id="c2-bio" class="char-input char-bio" placeholder="Profile & Memory..." style="text-align: right;" oninput="saveData()"></textarea>
            </div>
        </aside>
    </div>

    <div class="modal-overlay" id="editor-modal" data-html2canvas-ignore="true">
        <div class="editor-box">
            <div class="editor-tabs">
                <button class="tab-btn active" id="tab-story" onclick="switchTab('story')">서사 기록</button>
                <button class="tab-btn" id="tab-chapter" onclick="switchTab('chapter')">챕터 분기</button>
                <button class="btn btn-sub" style="margin-left:auto; padding:0;" onclick="closeModal()">X</button>
            </div>
            <div id="form-story" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="evDate" class="editor-input" placeholder="DATE (예: 2026.05.27)">
                <input type="text" id="evTitle" class="editor-input" placeholder="서사 제목">
                <label class="btn" style="text-align:center; background:rgba(255,255,255,0.02); border-color:var(--line);">
                    + 이미지 첨부 (메모지)
                    <input type="file" id="evFile" hidden accept="image/*" onchange="setTempImg(event)">
                </label>
                <div id="evPreviewWrap" style="display:none; position:relative;">
                    <div id="evPreview" style="height:80px; background-size:cover; background-position:center; border:1px solid var(--line);"></div>
                    <button class="btn" style="position:absolute; top:5px; right:5px; background:rgba(255,0,0,0.8); color:#fff; border:none; padding:4px 8px; font-size:10px;" onclick="removeTempImg()">X 삭제</button>
                </div>
                <textarea id="evContent" class="editor-input" style="height:120px; resize:none;" placeholder="서사 내용 작성..."></textarea>
                <button class="btn" style="background:var(--c-main); color:#000;" onclick="addItem('story')">저장</button>
            </div>
            <div id="form-chapter" style="display: none; flex-direction: column; gap: 12px;">
                <div style="font-size:10px; color:var(--c-main); text-align:center; margin-bottom:5px;">※ 챕터 번호는 자동 부여됩니다.</div>
                <input type="text" id="chTitle" class="editor-input" placeholder="에피소드 타이틀">
                <input type="text" id="chSub" class="editor-input" placeholder="서브 문구 / 날짜">
                <button class="btn" style="background:var(--c-main); color:#000;" onclick="addItem('chapter')">챕터 저장</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="guide-modal" data-html2canvas-ignore="true">
        <div class="editor-box" style="width: 450px;">
            <div style="font-size:16px; font-weight:bold; color:var(--c-main); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px;">
                🌐 전시관 공유 가이드
                <button class="btn btn-sub" style="float:right; padding:0;" onclick="document.getElementById('guide-modal').style.display='none'">X</button>
            </div>
            <div style="font-size:12px; line-height:1.8; color:var(--text-pri);">
                <span style="color:var(--c-sub);">1.</span> 우측 상단의 <b>[HTML 전시관 내보내기]</b> 버튼을 클릭합니다.<br>
                <span style="color:var(--c-sub);">2.</span> 다운로드된 HTML 파일은 애니메이션이 포함된 감상 전용 파일입니다.<br>
                <span style="color:var(--c-sub);">3.</span> <b>[app.netlify.com/drop]</b> 에 접속하여 파일을 드래그합니다.<br>
                <span style="color:var(--c-sub);">4.</span> 생성된 링크를 앤오님께 전달하세요!
            </div>
        </div>
    </div>

    <script>
        let defaultData = { pair:{title:'',sub:'',date:''}, c1:{img:'',name:'',bio:''}, c2:{img:'',name:'',bio:''}, theme:{main:'#d1bda0',sub:'#6d827c'}, bg:{img:'',blur:0,opacity:3}, settings:{grid:true,numStyle:'arabic'}, timeline:[], stickers:[] };
        let appData = JSON.parse(JSON.stringify(defaultData)); 
        let tempImg = ''; let editingId = null; let saveTimeout; 

        function mergeData(parsed) {
            appData.pair = { ...defaultData.pair, ...(parsed.pair || {}) };
            appData.c1 = { ...defaultData.c1, ...(parsed.c1 || {}) };
            appData.c2 = { ...defaultData.c2, ...(parsed.c2 || {}) };
            appData.theme = { ...defaultData.theme, ...(parsed.theme || {}) };
            appData.bg = { ...defaultData.bg, ...(parsed.bg || {}) };
            appData.settings = { ...defaultData.settings, ...(parsed.settings || {}) };
            appData.timeline = parsed.timeline || [];
            appData.stickers = parsed.stickers || [];
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.onload = () => {
            const saved = localStorage.getItem('oc_archive_v21'); 
            if(saved) { try { mergeData(JSON.parse(saved)); } catch(e){} }
            applyUI(); 
            document.getElementById('scroll-board').addEventListener('mousedown', (e) => {
                if(!e.target.closest('.sticker')) document.querySelectorAll('.sticker').forEach(s => s.classList.remove('active'));
            });
        };

        function applyUI() {
            document.getElementById('pair-title').value = appData.pair.title || ''; document.getElementById('pair-sub').value = appData.pair.sub || ''; document.getElementById('pair-date').value = appData.pair.date || ''; calcDday();
            document.getElementById('c1-name').value = appData.c1.name || ''; document.getElementById('c1-bio').value = appData.c1.bio || '';
            if(appData.c1.img) document.getElementById('char1-img').style.backgroundImage = `url(${appData.c1.img})`;
            document.getElementById('c2-name').value = appData.c2.name || ''; document.getElementById('c2-bio').value = appData.c2.bio || '';
            if(appData.c2.img) document.getElementById('char2-img').style.backgroundImage = `url(${appData.c2.img})`;
            document.getElementById('theme-main').value = appData.theme.main; document.getElementById('theme-sub').value = appData.theme.sub;
            
            const m = document.getElementById('theme-main').value; const s = document.getElementById('theme-sub').value;
            document.documentElement.style.setProperty('--c-main', m); document.documentElement.style.setProperty('--c-sub', s); document.documentElement.style.setProperty('--line', m + '25');
            
            if(appData.bg.img) document.getElementById('bg-canvas').style.backgroundImage = `url(${appData.bg.img})`;
            document.getElementById('bg-opacity').value = appData.bg.opacity; document.getElementById('bg-blur').value = appData.bg.blur;
            document.getElementById('bg-canvas').style.opacity = appData.bg.opacity / 10; document.getElementById('bg-canvas').style.filter = `blur(${appData.bg.blur}px)`;
            
            applySettingsUI(); renderTimeline(); renderStickers();
        }

        function saveData(immediate = false) {
            appData.pair = { title: document.getElementById('pair-title').value, sub: document.getElementById('pair-sub').value, date: document.getElementById('pair-date').value };
            appData.c1.name = document.getElementById('c1-name').value; appData.c1.bio = document.getElementById('c1-bio').value;
            appData.c2.name = document.getElementById('c2-name').value; appData.c2.bio = document.getElementById('c2-bio').value;
            appData.theme.main = document.getElementById('theme-main').value; appData.theme.sub = document.getElementById('theme-sub').value;
            appData.bg.opacity = document.getElementById('bg-opacity').value; appData.bg.blur = document.getElementById('bg-blur').value;
            
            const performSave = () => { try { localStorage.setItem('oc_archive_v21', JSON.stringify(appData)); } catch(e) { console.error("Save Error", e); } };
            clearTimeout(saveTimeout); if(immediate) performSave(); else saveTimeout = setTimeout(performSave, 500); 
        }

        function calcDday() {
            const dateStr = document.getElementById('pair-date').value; const res = document.getElementById('dday-result');
            if(!dateStr) { res.innerText = "D-DAY"; return; }
            const diffDays = Math.ceil((new Date() - new Date(dateStr)) / (1000 * 60 * 60 * 24));
            res.innerText = diffDays > 0 ? `D+${diffDays}` : (diffDays < 0 ? `D${diffDays}` : `D-DAY`);
        }

        function updateColors() { const m = document.getElementById('theme-main').value; const s = document.getElementById('theme-sub').value; document.documentElement.style.setProperty('--c-main', m); document.documentElement.style.setProperty('--c-sub', s); document.documentElement.style.setProperty('--line', m + '25'); saveData(); }
        function updateBgStyle() { appData.bg.opacity = document.getElementById('bg-opacity').value; appData.bg.blur = document.getElementById('bg-blur').value; document.getElementById('bg-canvas').style.opacity = appData.bg.opacity / 10; document.getElementById('bg-canvas').style.filter = `blur(${appData.bg.blur}px)`; saveData(); }
        function handleBgUpload(e) { if(e.target.files[0]) compressImage(e.target.files[0], d => { appData.bg.img = d; document.getElementById('bg-canvas').style.backgroundImage = `url(${d})`; saveData(true); }); }
        function handleImgUpload(e, id, key) { if(e.target.files[0]) compressImage(e.target.files[0], d => { appData[key].img = d; document.getElementById(id).style.backgroundImage = `url(${d})`; saveData(true); }); }
        function toggleGrid() { appData.settings.grid = !appData.settings.grid; applySettingsUI(); saveData(); }
        function toggleNumStyle() { appData.settings.numStyle = appData.settings.numStyle === 'arabic' ? 'roman' : 'arabic'; applySettingsUI(); renderTimeline(); saveData(); }
        function applySettingsUI() {
            document.getElementById('bg-grid').style.display = appData.settings.grid ? 'block' : 'none';
            document.getElementById('grid-toggle-btn').innerText = `격자 [${appData.settings.grid ? 'ON' : 'OFF'}]`;
            document.getElementById('num-style-btn').innerText = `챕터 [${appData.settings.numStyle === 'arabic' ? '01' : ' I '}]`;
        }

        function toRoman(num) { const roman = {M:1000, CM:900, D:500, CD:400, C:100, XC:90, L:50, XL:40, X:10, IX:9, V:5, IV:4, I:1}; let str = ''; for (let i of Object.keys(roman)) { let q = Math.floor(num / roman[i]); num -= q * roman[i]; str += i.repeat(q); } return str; }
        function openGuide() { document.getElementById('guide-modal').style.display = 'flex'; }
        function resetAllData() { if(confirm("모든 데이터가 영구적으로 삭제됩니다!\n초기화하시겠습니까?")) { localStorage.removeItem('oc_archive_v21'); location.reload(); } }

        /* [V21: 이미지 제거 및 클리닝 기능 강화] */
        function clearModalFields() {
            document.getElementById('evDate').value = ''; document.getElementById('evTitle').value = ''; document.getElementById('evContent').value = '';
            document.getElementById('evPreviewWrap').style.display = 'none'; document.getElementById('evFile').value = ''; 
            document.getElementById('chTitle').value = ''; document.getElementById('chSub').value = '';
            tempImg = ''; editingId = null;
        }

        function removeTempImg() {
            tempImg = ''; 
            document.getElementById('evPreview').style.backgroundImage = 'none';
            document.getElementById('evPreviewWrap').style.display = 'none';
            document.getElementById('evFile').value = '';
        }

        function setTempImg(e) { 
            if(e.target.files[0]) {
                compressImage(e.target.files[0], d => { 
                    tempImg = d; 
                    const p = document.getElementById('evPreview'); 
                    p.style.backgroundImage = `url(${d})`; 
                    document.getElementById('evPreviewWrap').style.display = 'block'; 
                }); 
            }
        }

        function openModal(type) { clearModalFields(); document.getElementById('editor-modal').style.display = 'flex'; switchTab(type); }
        function closeModal() { document.getElementById('editor-modal').style.display = 'none'; editingId = null; }
        function switchTab(type) { document.getElementById('tab-story').classList.toggle('active', type === 'story'); document.getElementById('tab-chapter').classList.toggle('active', type === 'chapter'); document.getElementById('form-story').style.display = type === 'story' ? 'flex' : 'none'; document.getElementById('form-chapter').style.display = type === 'chapter' ? 'flex' : 'none'; }

        function editItem(id) {
            const item = appData.timeline.find(i => i.id === id); if(!item) return;
            editingId = id; document.getElementById('editor-modal').style.display = 'flex';
            if(item.type === 'story') {
                switchTab('story'); document.getElementById('evDate').value = item.date; document.getElementById('evTitle').value = item.title; document.getElementById('evContent').value = item.content; 
                tempImg = item.img || ''; 
                const p = document.getElementById('evPreview'); 
                if(tempImg){ p.style.backgroundImage=`url(${tempImg})`; document.getElementById('evPreviewWrap').style.display='block';} 
                else { document.getElementById('evPreviewWrap').style.display='none'; }
            } else { switchTab('chapter'); document.getElementById('chTitle').value = item.title; document.getElementById('chSub').value = item.sub; }
        }

        function addItem(type) {
            if(type === 'story') {
                const title = document.getElementById('evTitle').value; if(!title) return alert("제목 필수.");
                if(editingId) { const i = appData.timeline.find(x => x.id === editingId); i.date = document.getElementById('evDate').value; i.title = title; i.content = document.getElementById('evContent').value; i.img = tempImg; }
                else appData.timeline.push({ type:'story', id:Date.now(), date:document.getElementById('evDate').value, title:title, content:document.getElementById('evContent').value, img:tempImg });
            } else {
                const title = document.getElementById('chTitle').value; if(!title) return alert("타이틀 필수.");
                if(editingId) { const i = appData.timeline.find(x => x.id === editingId); i.title = title; i.sub = document.getElementById('chSub').value; }
                else appData.timeline.push({ type:'chapter', id:Date.now(), title:title, sub:document.getElementById('chSub').value });
            }
            closeModal(); saveData(true); renderTimeline();
        }
        function deleteItem(id) { appData.timeline = appData.timeline.filter(i => i.id !== id); saveData(true); renderTimeline(); }

        function renderTimeline() {
            const box = document.getElementById('timeline-box'); box.innerHTML = '';
            let currentRows = []; let storyCounter = 1; let chapterCounter = 1;
            function flushRows() {
                for(let i=0; i<currentRows.length; i++) {
                    const rowItems = currentRows[i]; const isRev = (i % 2 !== 0); const isLast = (i === currentRows.length - 1);
                    let rowHtml = `<div class="timeline-row ${isRev ? 'row-reverse' : 'row-normal'}${!isLast ? ' has-curve' : ''}">`;
                    rowItems.forEach(item => {
                        const formattedNum = storyCounter.toString().padStart(2, '0');
                        rowHtml += `<div class="story-card"><div class="card-no">No.${formattedNum}</div>${item.img ? `<div class="card-img-memo" style="background-image: url(${item.img})"></div>` : ''}<div class="card-date">${item.date}</div><div class="card-title">${item.title}</div><div class="card-desc">${item.content}</div><div class="card-controls" data-html2canvas-ignore="true"><button class="btn-edit" onclick="editItem(${item.id})">수정</button><button class="btn-del" onclick="deleteItem(${item.id})">삭제</button></div></div>`;
                        storyCounter++;
                    });
                    rowHtml += `</div>`; box.innerHTML += rowHtml;
                }
                currentRows = [];
            }
            let tempRow = [];
            appData.timeline.forEach(item => {
                if (item.type === 'chapter') {
                    if (tempRow.length > 0) { currentRows.push(tempRow); tempRow = []; } flushRows();
                    const chNum = appData.settings.numStyle === 'arabic' ? chapterCounter.toString().padStart(2, '0') : toRoman(chapterCounter);
                    box.innerHTML += `<div class="chapter-divider"><div class="chapter-text-content"><div class="ch-controls" data-html2canvas-ignore="true"><button class="btn-edit" onclick="editItem(${item.id})">수정</button><button class="ch-del-btn" onclick="deleteItem(${item.id})">X</button></div><div class="ch-label">CHAPTER</div><div class="ch-number">${chNum}</div><div class="ch-title">${item.title}</div><div class="ch-sub">${item.sub}</div></div></div>`;
                    chapterCounter++;
                } else { tempRow.push(item); if (tempRow.length === 3) { currentRows.push(tempRow); tempRow = []; } }
            });
            if (tempRow.length > 0) currentRows.push(tempRow); flushRows();
        }

        let highestZ = 50; let draggingSticker = null; let sStartX, sStartY;
        function addSticker(e) { if(e.target.files[0]) compressImage(e.target.files[0], d => { appData.stickers.push({ id:Date.now(), img:d, x:400, y:300, w:150, h:150, r:0, z:++highestZ }); saveData(true); renderStickers(); }); }
        function renderStickers() {
            const layer = document.getElementById('sticker-layer'); layer.innerHTML = '';
            appData.stickers.forEach(s => {
                const el = document.createElement('div'); el.className = 'sticker'; el.style.backgroundImage = `url(${s.img})`; el.style.width = s.w + 'px'; el.style.height = s.h + 'px'; el.style.left = s.x + 'px'; el.style.top = s.y + 'px'; el.style.transform = `rotate(${s.r}deg)`; el.style.zIndex = s.z;
                el.innerHTML = `<div class="sticker-controls" data-html2canvas-ignore="true"><button onclick="changeStickerZ(${s.id}, 1)">▲</button><button onclick="changeStickerZ(${s.id}, -1)">▼</button><button style="color:#ff5555;" onclick="deleteSticker(${s.id})">X</button></div><div class="sticker-tip" data-html2canvas-ignore="true">드래그/휠/Shift+휠</div>`;
                el.addEventListener('mousedown', e => { if(e.target.closest('.sticker-controls')) return; document.querySelectorAll('.sticker').forEach(st => st.classList.remove('active')); el.classList.add('active'); s.z = ++highestZ; el.style.zIndex = s.z; draggingSticker = s; sStartX = e.clientX - s.x; sStartY = e.clientY - s.y; });
                el.addEventListener('wheel', e => { if(!el.classList.contains('active')) return; e.preventDefault(); if(e.shiftKey) s.r += e.deltaY * 0.1; else { let d = e.deltaY * 0.2; s.w -= d; s.h -= d; if(s.w < 30) s.w = 30; } el.style.width = s.w + 'px'; el.style.height = s.h + 'px'; el.style.transform = `rotate(${s.r}deg)`; saveData(); }, {passive: false});
                layer.appendChild(el);
            });
        }
        window.addEventListener('mousemove', e => { if(draggingSticker) { draggingSticker.x = e.clientX - sStartX; draggingSticker.y = e.clientY - sStartY; renderStickers(); } });
        window.addEventListener('mouseup', () => { if(draggingSticker){ draggingSticker = null; saveData(); }});
        function changeStickerZ(id, dir) { const s = appData.stickers.find(i => i.id === id); if(s) { s.z += (dir * 2); renderStickers(); saveData(true); } }
        function deleteSticker(id) { appData.stickers = appData.stickers.filter(s => s.id !== id); saveData(true); renderStickers(); }

        function captureSetup() {
            const wrapper = document.getElementById('capture-area'); wrapper.classList.add('capture-mode');
            const inputs = wrapper.querySelectorAll('input.char-input, textarea.char-input, input.pair-input, input.ph-date-input');
            inputs.forEach(inp => {
                const div = document.createElement('div'); div.className = inp.className + ' static-text-clone'; div.innerHTML = inp.value.replace(/\n/g, '<br>');
                const style = window.getComputedStyle(inp); div.style.color = style.color; div.style.fontSize = style.fontSize; div.style.fontWeight = style.fontWeight; div.style.letterSpacing = style.letterSpacing; div.style.textAlign = style.textAlign; div.style.minHeight = inp.offsetHeight + 'px';
                if(style.textAlign === 'right') div.style.justifyContent = 'flex-end'; else if(inp.classList.contains('pair-input')) div.style.justifyContent = 'center';
                inp.style.display = 'none'; inp.parentNode.insertBefore(div, inp);
            });
        }
        function captureRestore() {
            const wrapper = document.getElementById('capture-area'); wrapper.classList.remove('capture-mode');
            wrapper.querySelectorAll('.static-text-clone').forEach(d => d.remove());
            wrapper.querySelectorAll('input.char-input, textarea.char-input, input.pair-input, input.ph-date-input').forEach(i => i.style.display = '');
            applyUI(); 
        }

        function exportImage() {
            saveData(true); 
            const wrapper = document.getElementById('capture-area'); const board = document.getElementById('scroll-board');
            const w = wrapper.offsetWidth; const h = board.scrollHeight; const backupW = wrapper.style.width; const backupH = wrapper.style.height; const backupOverflow = board.style.overflowY;
            wrapper.style.width = w + 'px'; wrapper.style.height = h + 'px'; board.style.overflowY = 'visible'; captureSetup();
            document.fonts.ready.then(() => { setTimeout(() => {
                html2canvas(wrapper, { backgroundColor: "#0a0b0d", scale: 1, useCORS: true, width: w, height: h, logging: false })
                .then(canvas => { const a = document.createElement('a'); a.href = canvas.toDataURL("image/jpeg", 0.9); a.download = `CHRONICLE_${appData.pair.title || 'ARCHIVE'}.jpg`; a.click(); wrapper.style.width = backupW; wrapper.style.height = backupH; board.style.overflowY = backupOverflow; captureRestore(); });
            }, 500); });
        }

        function exportHTMLViewer() {
            saveData(true); 
            const wrapper = document.getElementById('capture-area'); captureSetup(); 
            const clone = wrapper.cloneNode(true);
            clone.classList.remove('capture-mode'); 
            clone.querySelector('#hud-panel')?.remove();
            clone.querySelectorAll('.card-controls, .ch-controls, .sticker-controls, .sticker-tip, input[type="file"], .del-btn').forEach(el => el.remove());
            clone.querySelectorAll('*').forEach(el => { el.removeAttribute('onclick'); el.removeAttribute('oninput'); el.removeAttribute('onchange'); el.removeAttribute('onmousedown'); });
            clone.querySelector('#scroll-board').style.pointerEvents = 'auto';

            const activeMain = getComputedStyle(document.documentElement).getPropertyValue('--c-main').trim();
            const activeSub = getComputedStyle(document.documentElement).getPropertyValue('--c-sub').trim();
            const activeBg = getComputedStyle(document.documentElement).getPropertyValue('--c-bg').trim();

            const exhibitionStyle = `
                <style>
                    :root { --c-main: ${activeMain}; --c-sub: ${activeSub}; --c-bg: ${activeBg}; --line: ${activeMain}25; }
                    body { overflow: auto; background: var(--c-bg); }
                    .sticker { pointer-events: none !important; border:none !important; }
                    .static-text-clone { display: flex !important; }
                    .story-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; border-color: var(--c-main); }
                    .story-card:hover .card-img-memo { transform: rotate(0deg) scale(2) translate(-10px, 10px) !important; z-index: 20; filter: grayscale(0%); border-top-color: var(--c-main); }
                </style>
            `;

            const htmlHeader = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${appData.pair.title || 'ARCHIVE'}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>${document.getElementById('core-css').innerHTML}</style>${exhibitionStyle}</head><body>`;
            const finalHTML = htmlHeader + clone.outerHTML + `</body></html>`;
            const blob = new Blob([finalHTML], {type: "text/html;charset=utf-8"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `VIEWER_${appData.pair.title || 'ARCHIVE'}.html`; a.click();
            captureRestore(); alert("테마 컬러와 애니메이션이 완벽하게 박제된 전시관 HTML이 생성되었습니다!");
        }

        function importData(e) { 
            const f = e.target.files[0]; if(!f) return; 
            const r = new FileReader(); 
            r.onload = ev => { 
                try {
                    const parsed = JSON.parse(ev.target.result);
                    mergeData(parsed); applyUI(); saveData(true); alert("데이터 로드 완료!"); 
                } catch(err) { alert("파일이 손상되었거나 형식이 맞지 않습니다."); }
                e.target.value = ''; 
            }; 
            r.readAsText(f); 
        }
        function exportData() { saveData(true); const b = new Blob([JSON.stringify(appData)], {type: 'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `ARCHIVE_DATA.txt`; a.click(); }
    </script>
</body>
