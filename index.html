<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC ARTBOARD SYSTEM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            /* 컬러 팔레트 최적화: 심해와 우주의 경계 */
            --bg: #07090f;
            --panel: rgba(11, 14, 23, 0.65);
            --panel2: rgba(22, 27, 38, 0.85);
            --accent: #8ea1ff;
            --accent2: #63ffe9;
            --text: #edf2ff;
            --muted: rgba(237, 242, 255, 0.5);
            --line: rgba(142, 161, 255, 0.15);
            --glow: 0 0 20px rgba(142, 161, 255, 0.2);
        }

        * { box-sizing: border-box; outline: none; }
        
        body, html {
            width: 100%; height: 100%; margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: var(--bg); color: var(--text);
            overflow: hidden; /* 전체 스크롤 막고 보드 안에서만 스크롤 */
        }

        /* 1. 배경 시스템 (SF 감성 극대화) */
        .bg { position: fixed; inset: 0; z-index: -20; background: var(--bg); }
        .bg-image {
            position: absolute; inset: -10%; background-size: cover; background-position: center;
            opacity: 0.3; filter: blur(15px); transition: 0.5s ease;
        }
        .bg-noise {
            position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: overlay;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        .bg-grid {
            position: absolute; inset: 0; opacity: 0.3;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, white, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, white, transparent 80%);
        }

        /* 2. 헤더 (시스템 HUD 느낌) */
        .header {
            height: 70px; border-bottom: 1px solid var(--line);
            background: rgba(7, 9, 15, 0.8); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; position: relative; z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
        
        input, textarea, button { font-family: inherit; }
        input, textarea {
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2);
            color: white; border-radius: 6px; transition: 0.3s ease; padding: 0 15px;
        }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(142,161,255,0.2); }
        
        .pair-name-input { width: 250px; height: 40px; font-size: 16px; font-weight: 800; letter-spacing: 0.05em; color: var(--accent2); }
        .pair-keyword-input { width: 200px; height: 40px; font-size: 13px; letter-spacing: 0.1em; }
        
        .header-btn {
            height: 40px; border: 1px solid var(--accent); background: rgba(142,161,255,0.05);
            color: var(--accent); border-radius: 6px; padding: 0 20px; cursor: pointer;
            font-size: 12px; font-weight: 700; letter-spacing: 0.1em; transition: 0.3s ease;
        }
        .header-btn:hover { background: var(--accent); color: var(--bg); box-shadow: var(--glow); }

        /* 3. 메인 보드 레이아웃 */
        .board {
            height: calc(100vh - 70px); display: grid;
            grid-template-columns: 320px minmax(0, 1fr); gap: 0; /* 분리된 느낌을 없애고 하나로 융합 */
            padding: 0; position: relative;
        }

        /* 4. 프로필 패널 (좌측 고정, 유리 질감) */
        .profile-column {
            background: var(--panel); border-right: 1px solid var(--line);
            backdrop-filter: blur(20px); padding: 30px; overflow-y: auto; z-index: 10;
            display: flex; flex-direction: column; gap: 25px;
        }
        .profile-column::-webkit-scrollbar { width: 4px; }
        .profile-column::-webkit-scrollbar-thumb { background: var(--accent); }

        .profile-panel { display: flex; flex-direction: column; gap: 10px; }
        .panel-label { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; }
        
        .profile-image {
            width: 100%; aspect-ratio: 1/1; border-radius: 12px;
            border: 1px solid var(--line); background: rgba(0,0,0,0.5);
            background-size: cover; background-position: center;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .profile-image::after {
            content: 'CLICK TO UPLOAD'; position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
            letter-spacing: 0.1em; color: var(--muted); opacity: 1; transition: 0.3s;
        }
        .profile-image.has-img::after { opacity: 0; }
        
        .profile-name { height: 45px; font-size: 18px; font-weight: 800; text-align: center; }
        .profile-bio { min-height: 120px; padding: 15px; font-size: 13px; line-height: 1.8; resize: none; }

        /* 5. 스토리 타임라인 (수직 스크롤 아트보드) */
        .story-board-wrap {
            position: relative; overflow-y: auto; overflow-x: hidden;
            padding: 60px; scroll-behavior: smooth;
        }
        .story-board-wrap::-webkit-scrollbar { width: 0; } /* 캡처를 위해 숨김 */

        .story-board {
            max-width: 1000px; margin: 0 auto; position: relative;
            display: flex; flex-direction: column; gap: 40px; padding: 40px 0;
        }
        /* 중앙 관통 라인 */
        .story-board::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            transform: translateX(-50%); opacity: 0.5;
        }

        /* 6. 서사 카드 (교차 정렬 방식) */
        .story-card {
            width: calc(50% - 40px); background: var(--panel2);
            border: 1px solid var(--line); border-radius: 16px;
            padding: 30px; position: relative; backdrop-filter: blur(10px);
            transition: 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* 좌우 정렬 및 연결선 */
        .story-card:nth-child(odd) { align-self: flex-start; }
        .story-card:nth-child(even) { align-self: flex-end; }
        
        .story-card::after {
            content: ''; position: absolute; top: 40px; width: 40px; height: 2px; background: var(--accent); opacity: 0.5;
        }
        .story-card:nth-child(odd)::after { right: -40px; }
        .story-card:nth-child(even)::after { left: -40px; }
        
        /* 타임라인 노드(점) */
        .story-card::before {
            content: ''; position: absolute; top: 35px; width: 12px; height: 12px;
            background: var(--bg); border: 2px solid var(--accent2); border-radius: 50%; z-index: 2;
            box-shadow: 0 0 10px var(--accent2);
        }
        .story-card:nth-child(odd)::before { right: -47px; }
        .story-card:nth-child(even)::before { left: -47px; }

        .story-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: var(--glow); }

        .story-date { font-size: 12px; font-weight: 700; color: var(--accent2); letter-spacing: 0.1em; margin-bottom: 10px; }
        .story-title { font-size: 24px; font-weight: 900; line-height: 1.3; margin-bottom: 20px; letter-spacing: -0.03em; }
        .story-image { width: 100%; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .story-text { font-size: 14px; line-height: 1.9; color: var(--muted); white-space: pre-wrap; word-break: keep-all; }

        .delete-btn {
            position: absolute; top: 20px; right: 20px; background: transparent; border: none;
            color: #ff4d4d; font-size: 11px; cursor: pointer; opacity: 0.3; transition: 0.2s;
        }
        .story-card:hover .delete-btn { opacity: 1; }

        /* 7. 에디터 (우측 하단 플로팅) */
        .editor {
            position: fixed; right: 30px; bottom: 30px; width: 400px;
            background: rgba(7, 9, 15, 0.95); border: 1px solid var(--accent);
            border-radius: 16px; padding: 25px; backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 15px; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), var(--glow);
            transform: translateY(120%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .editor.open { transform: translateY(0); }

        .editor-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
        .editor-label { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: 0.1em; }
        .close-btn { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; }

        .editor input { height: 45px; }
        .editor textarea { height: 120px; padding-top: 15px; }
        .file-upload-btn {
            border: 1px dashed var(--line); background: rgba(0,0,0,0.2); color: var(--muted);
            height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .file-upload-btn:hover { border-color: var(--accent); color: var(--accent); }

        .complete-btn {
            height: 50px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #000; font-weight: 900; font-size: 15px; letter-spacing: 0.1em;
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .complete-btn:hover { box-shadow: 0 0 20px rgba(99, 255, 233, 0.4); transform: scale(1.02); }

    </style>
</head>
<body>

    <div class="bg">
        <div class="bg-image" id="main-bg-img"></div>
        <div class="bg-grid"></div>
        <div class="bg-noise"></div>
    </div>

    <header class="header">
        <div class="header-left">
            <input type="text" class="pair-name-input" id="pair-name" placeholder="PAIR CODENAME // 페어명">
            <input type="text" class="pair-keyword-input" id="pair-keyword" placeholder="RELATION KEYWORD // 관계 키워드">
        </div>
        <div class="header-right">
            <label class="header-btn" style="display:flex; align-items:center; cursor:pointer;">
                배경 이미지 변경
                <input type="file" hidden accept="image/*" onchange="changeBackground(event)">
            </label>
            <button class="header-btn" onclick="toggleEditor()">+ 새 서사 기록</button>
            <button class="header-btn" onclick="exportArtboard()" style="border-color: var(--accent2); color: var(--accent2);">아트보드 내보내기 (PNG)</button>
        </div>
    </header>

    <main class="board" id="capture-area">
        
        <aside class="profile-column">
            <div class="profile-panel">
                <div class="panel-label">CHARACTER 01</div>
                <label class="profile-image" id="p1-img-box">
                    <input type="file" hidden accept="image/*" onchange="loadProfileImg(event, 'p1-img-box')">
                </label>
                <input type="text" class="profile-name" placeholder="NAME">
                <textarea class="profile-bio" placeholder="프로필 요약 및 서사 데이터 입력..."></textarea>
            </div>
            
            <div style="height: 1px; background: var(--line); margin: 10px 0;"></div>

            <div class="profile-panel">
                <div class="panel-label">CHARACTER 02</div>
                <label class="profile-image" id="p2-img-box">
                    <input type="file" hidden accept="image/*" onchange="loadProfileImg(event, 'p2-img-box')">
                </label>
                <input type="text" class="profile-name" placeholder="NAME">
                <textarea class="profile-bio" placeholder="프로필 요약 및 서사 데이터 입력..."></textarea>
            </div>
        </aside>

        <section class="story-board-wrap" id="board-wrap">
            <div class="story-board" id="timeline-container">
                </div>
        </section>
    </main>

    <div class="editor" id="editor-panel">
        <div class="editor-header">
            <span class="editor-label">ADD NEW CHRONICLE</span>
            <button class="close-btn" onclick="toggleEditor()">×</button>
        </div>
        <input type="text" id="evDate" placeholder="DATE (ex: 2026.05.27)">
        <input type="text" id="evTitle" placeholder="EPISODE TITLE">
        <label class="file-upload-btn">
            + 썸네일 이미지 첨부 (선택)
            <input type="file" id="evImg" hidden accept="image/*" onchange="setTempImage(event)">
        </label>
        <img id="temp-img-preview" src="" style="display:none; width:100%; border-radius:6px; border:1px solid var(--line);">
        <textarea id="evContent" placeholder="서사 내용을 작성하십시오..."></textarea>
        <button class="complete-btn" onclick="addStoryCard()">RECORD >></button>
    </div>

    <script>
        let tempImgSrc = '';

        // 에디터 열기/닫기
        function toggleEditor() {
            document.getElementById('editor-panel').classList.toggle('open');
        }

        // 전체 배경 변경
        function changeBackground(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('main-bg-img').style.backgroundImage = `url(${e.target.result})`;
                }
                reader.readAsDataURL(file);
            }
        }

        // 프로필 이미지 업로드
        function loadProfileImg(event, boxId) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const box = document.getElementById(boxId);
                    box.style.backgroundImage = `url(${e.target.result})`;
                    box.classList.add('has-img');
                }
                reader.readAsDataURL(file);
            }
        }

        // 에디터 임시 이미지
        function setTempImage(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    tempImgSrc = e.target.result;
                    const preview = document.getElementById('temp-img-preview');
                    preview.src = tempImgSrc;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // 타임라인 카드 추가
        function addStoryCard() {
            const date = document.getElementById('evDate').value;
            const title = document.getElementById('evTitle').value;
            const content = document.getElementById('evContent').value;

            if(!title) { alert("서사의 제목은 톱니바퀴의 축입니다. 반드시 입력하십시오."); return; }

            const container = document.getElementById('timeline-container');
            const card = document.createElement('div');
            card.className = 'story-card';
            
            let imgHTML = tempImgSrc ? `<img src="${tempImgSrc}" class="story-image" style="display:block;">` : '';

            card.innerHTML = `
                <button class="delete-btn" onclick="this.parentElement.remove()">[삭제]</button>
                <div class="story-date">${date}</div>
                <div class="story-title">${title}</div>
                ${imgHTML}
                <div class="story-text">${content}</div>
            `;
            
            container.appendChild(card);

            // 초기화 및 닫기
            document.getElementById('evDate').value = '';
            document.getElementById('evTitle').value = '';
            document.getElementById('evContent').value = '';
            document.getElementById('temp-img-preview').style.display = 'none';
            tempImgSrc = '';
            toggleEditor();

            // 추가 후 맨 아래로 스크롤
            const wrap = document.getElementById('board-wrap');
            wrap.scrollTo({ top: wrap.scrollHeight, behavior: 'smooth' });
        }

        // 아트보드 이미지로 내보내기 (가장 중요한 기능)
        function exportArtboard() {
            const target = document.getElementById('capture-area');
            const wrap = document.getElementById('board-wrap');
            const pairName = document.getElementById('pair-name').value || 'OC_PAIR';
            
            // 캡처를 위해 전체 스크롤 길이를 임시로 풀어서 모든 카드가 보이게 함
            const originalOverflow = wrap.style.overflow;
            const originalHeight = target.style.height;
            wrap.style.overflow = 'visible';
            target.style.height = 'auto';

            html2canvas(target, {
                backgroundColor: window.getComputedStyle(document.body).backgroundColor,
                scale: 2, // 고해상도 추출
                useCORS: true
            }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `ARTBOARD_${pairName}.png`;
                a.click();

                // 원상복구
                wrap.style.overflow = originalOverflow;
                target.style.height = originalHeight;
            });
        }
    </script>
</body>
</html>
