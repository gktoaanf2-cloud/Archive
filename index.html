<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive System</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>

<body>

<!-- BG -->

<div class="bg">

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="grid"></div>

  <div class="glow glow-a"></div>

  <div class="glow glow-b"></div>

</div>

<!-- APP -->

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-scroll">

      <div class="subtitle">
        PROJECT
      </div>

      <!-- PROJECT -->

      <div class="panel">

        <input
          id="projectName"
          placeholder="프로젝트 이름"
        />

        <button
          class="main-btn full"
          onclick="saveProject()"
        >
          프로젝트 저장
        </button>

        <select
          id="projectSelect"
          onchange="loadProject(this.value)"
        >
        </select>

      </div>

      <!-- PAIR -->

      <div class="panel">

        <div class="subtitle">
          PAIR
        </div>

        <input
          id="pairName"
          placeholder="페어명"
        />

        <input
          id="pairTag"
          placeholder="관계 키워드"
        />

      </div>

      <!-- CHARACTER A -->

      <div class="panel character-card">

        <div class="character-top">

          <div
            class="profile-preview"
            id="profileA"
          ></div>

          <div>

            <div class="character-title">
              Character A
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'A')"
            />

          </div>

        </div>

        <input
          id="charAName"
          placeholder="캐릭터 이름"
        />

        <textarea
          id="charABio"
          placeholder="캐릭터 소개"
        ></textarea>

      </div>

      <!-- CHARACTER B -->

      <div class="panel character-card">

        <div class="character-top">

          <div
            class="profile-preview"
            id="profileB"
          ></div>

          <div>

            <div class="character-title">
              Character B
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="uploadCharacter(event, 'B')"
            />

          </div>

        </div>

        <input
          id="charBName"
          placeholder="캐릭터 이름"
        />

        <textarea
          id="charBBio"
          placeholder="캐릭터 소개"
        ></textarea>

      </div>

      <!-- EXPORT -->

      <div class="panel">

        <button
          class="main-btn full"
          onclick="exportTXT()"
        >
          TXT 저장
        </button>

        <button
          class="main-btn full"
          onclick="exportPNG()"
        >
          PNG 저장
        </button>

        <input
          type="file"
          accept=".txt"
          onchange="importTXT(event)"
        />

      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main
    class="main"
    id="captureTarget"
  >

    <div class="hero">

      <div>

        <div class="subtitle">
          ARCHIVE
        </div>

        <h1 class="title">
          Timeline
        </h1>

      </div>

      <div class="hero-buttons">

        <button
          class="main-btn"
          onclick="addChapter()"
        >
          + 챕터
        </button>

        <button
          class="main-btn"
          onclick="addTimeline()"
        >
          + 에피소드
        </button>

      </div>

    </div>

    <!-- REL GRAPH -->

    <div class="panel relation-panel">

      <div class="subtitle">
        RELATION GRAPH
      </div>

      <canvas
        id="relationCanvas"
        width="900"
        height="220"
      ></canvas>

    </div>

    <!-- TIMELINE -->

    <div
      class="timeline"
      id="timeline"
    ></div>

  </main>

  <!-- SETTINGS -->

  <aside class="settings">

    <div class="subtitle">
      SETTINGS
    </div>

    <!-- COLOR -->

    <div class="panel">

      <div class="setting-label">
        메인 컬러
      </div>

      <input
        type="color"
        value="#91a2ff"
        onchange="setAccent(this.value)"
      />

    </div>

    <!-- BG -->

    <div class="panel">

      <div class="setting-label">
        배경 이미지
      </div>

      <input
        type="file"
        accept="image/*"
        onchange="changeBG(event)"
      />

      <div class="setting-label">
        블러
      </div>

      <input
        type="range"
        min="0"
        max="40"
        value="0"
        oninput="setBlur(this.value)"
      />

      <div class="setting-label">
        확대
      </div>

      <input
        type="range"
        min="1"
        max="2"
        step="0.01"
        value="1"
        oninput="setScale(this.value)"
      />

      <div class="setting-label">
        회전
      </div>

      <input
        type="range"
        min="-180"
        max="180"
        value="0"
        oninput="setRotate(this.value)"
      />

      <div class="setting-label">
        X 이동
      </div>

      <input
        type="range"
        min="-500"
        max="500"
        value="0"
        oninput="setPosX(this.value)"
      />

      <div class="setting-label">
        Y 이동
      </div>

      <input
        type="range"
        min="-500"
        max="500"
        value="0"
        oninput="setPosY(this.value)"
      />

    </div>

  </aside>

</div>

<script>

let state = JSON.parse(
  localStorage.getItem('pairArchiveData')
) || {

  projectName: '',

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  timelines: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,

  posX: 0,

  posY: 0,
}

const timelineEl =
  document.getElementById('timeline')

const bgImage =
  document.getElementById('bgImage')

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )

  renderProjectList()
}

function renderProjectList() {

  const select =
    document.getElementById('projectSelect')

  select.innerHTML = ''

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  projects.forEach(project => {

    const option =
      document.createElement('option')

    option.value =
      project.projectName

    option.innerText =
      project.projectName

    select.appendChild(option)
  })
}

function saveProject() {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const filtered =
    projects.filter(
      p =>
      p.projectName !==
      state.projectName
    )

  filtered.push(state)

  localStorage.setItem(
    'pairProjects',
    JSON.stringify(filtered)
  )

  renderProjectList()
}

function loadProject(name) {

  const projects =
    JSON.parse(
      localStorage.getItem('pairProjects')
    ) || []

  const found =
    projects.find(
      p => p.projectName === name
    )

  if (!found) return

  state = found

  render()
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.filter =
    `blur(${state.blur}px)`

  bgImage.style.transform = `
    translate(${state.posX}px, ${state.posY}px)
    scale(${state.scale + (state.blur * 0.01)})
    rotate(${state.rotate}deg)
  `
}

function render() {

  projectName.value =
    state.projectName

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  timelineEl.innerHTML = ''

  state.timelines.forEach((item, index) => {

    const div =
      document.createElement('div')

    div.className =
      item.type === 'chapter'
      ? 'chapter-card'
      : 'panel timeline-item'

    if (item.type === 'chapter') {

      div.innerHTML = `
        <input
          class="chapter-input"
          placeholder="챕터 이름"
          value="${item.title || ''}"
          onchange="updateTimeline(${index}, 'title', this.value)"
        >
      `

    } else {

      div.innerHTML = `

        <div class="episode-number">
          EPISODE ${index + 1}
        </div>

        <input
          placeholder="날짜"
          value="${item.date || ''}"
          onchange="updateTimeline(${index}, 'date', this.value)"
        >

        <input
          placeholder="에피소드 제목"
          value="${item.title || ''}"
          onchange="updateTimeline(${index}, 'title', this.value)"
        >

        <textarea
          placeholder="서사를 입력하세요"
          onchange="updateTimeline(${index}, 'content', this.value)"
        >${item.content || ''}</textarea>

        <input
          type="range"
          min="0"
          max="100"
          value="${item.relation || 50}"
          onchange="updateTimeline(${index}, 'relation', this.value)"
        >

        <input
          type="file"
          accept="image/*"
          onchange="timelineImage(event, ${index})"
        >

        ${
          item.image
          ? `
            <img
              src="${item.image}"
              class="image-preview"
            >
          `
          : ''
        }
      `
    }

    timelineEl.appendChild(div)
  })

  applyBG()

  renderGraph()

  save()
}

function addTimeline() {

  state.timelines.push({

    type: 'episode',

    date: '',

    title: '',

    content: '',

    image: '',

    relation: 50,
  })

  render()
}

function addChapter() {

  state.timelines.push({

    type: 'chapter',

    title: '',
  })

  render()
}

function updateTimeline(index, key, value) {

  state.timelines[index][key] =
    value

  renderGraph()

  save()
}

function uploadCharacter(event, target) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function timelineImage(event, index) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.timelines[index].image =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty('--accent', color)
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setBlur(value) {

  state.blur = value

  applyBG()

  save()
}

function setScale(value) {

  state.scale = value

  applyBG()

  save()
}

function setRotate(value) {

  state.rotate = value

  applyBG()

  save()
}

function setPosX(value) {

  state.posX = value

  applyBG()

  save()
}

function setPosY(value) {

  state.posY = value

  applyBG()

  save()
}

function exportTXT() {

  const text =
    JSON.stringify(state, null, 2)

  const blob =
    new Blob(
      [text],
      {
        type: 'text/plain'
      }
    )

  const a =
    document.createElement('a')

  a.href =
    URL.createObjectURL(blob)

  a.download =
    `${state.projectName || 'pair'}.txt`

  a.click()
}

function importTXT(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state =
      JSON.parse(reader.result)

    render()
  }

  reader.readAsText(file)
}

async function exportPNG() {

  const target =
    document.getElementById('captureTarget')

  const canvas =
    await html2canvas(target)

  const link =
    document.createElement('a')

  link.download =
    `${state.projectName || 'pair'}.png`

  link.href =
    canvas.toDataURL()

  link.click()
}

function renderGraph() {

  const canvas =
    document.getElementById('relationCanvas')

  const ctx =
    canvas.getContext('2d')

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  )

  ctx.beginPath()

  ctx.strokeStyle =
    '#91a2ff'

  ctx.lineWidth = 4

  const episodes =
    state.timelines.filter(
      t => t.type === 'episode'
    )

  episodes.forEach((item, index) => {

    const x =
      60 + index * 120

    const y =
      180 - item.relation

    if (index === 0) {

      ctx.moveTo(x, y)

    } else {

      ctx.lineTo(x, y)
    }

    ctx.fillStyle =
      '#ffffff'

    ctx.beginPath()

    ctx.arc(x, y, 6, 0, Math.PI * 2)

    ctx.fill()
  })

  ctx.stroke()
}

projectName.oninput = e => {
  state.projectName = e.target.value
  save()
}

pairName.oninput = e => {
  state.pairName = e.target.value
  save()
}

pairTag.oninput = e => {
  state.pairTag = e.target.value
  save()
}

charAName.oninput = e => {
  state.charAName = e.target.value
  save()
}

charABio.oninput = e => {
  state.charABio = e.target.value
  save()
}

charBName.oninput = e => {
  state.charBName = e.target.value
  save()
}

charBBio.oninput = e => {
  state.charBBio = e.target.value
  save()
}

new Sortable(
  timelineEl,
  {
    animation: 200,

    onEnd: function(evt) {

      const moved =
        state.timelines.splice(
          evt.oldIndex,
          1
        )[0]

      state.timelines.splice(
        evt.newIndex,
        0,
        moved
      )

      save()
      renderGraph()
    }
  }
)

renderProjectList()

render()

</script>

</body>
</html>
