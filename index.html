<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Pair Archive</title>

<link
  rel="stylesheet"
  href="style.css"
/>

<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.3.0/dist/dom-to-image-more.min.js"></script>

</head>

<body>

<!-- BACKGROUND -->

<div
  class="bg"
  id="bg"
>

  <div
    class="bg-image"
    id="bgImage"
  ></div>

  <div class="bg-grid"></div>

</div>

<!-- HEADER -->

<header class="topbar">

  <div class="top-left">

    <input
      id="pairName"
      class="pair-input"
      placeholder="PAIR NAME"
    />

    <input
      id="pairTag"
      class="tag-input"
      placeholder="relationship keyword"
    />

  </div>

  <div class="top-right">

    <button
      class="top-btn"
      onclick="openCreatePanel()"
    >
      NEW EVENT
    </button>

    <button
      class="top-btn"
      onclick="exportPNG()"
    >
      EXPORT PNG
    </button>

  </div>

</header>

<!-- BOARD -->

<div
  class="board"
  id="exportBoard"
>

  <!-- LEFT -->

  <aside class="character-side">

    <div class="character-panel">

      <div
        class="profile-image"
        id="profileA"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'A')"
      />

      <input
        id="charAName"
        class="character-name"
        placeholder="Character A"
      />

      <textarea
        id="charABio"
        class="character-bio"
        placeholder="Character introduction"
      ></textarea>

    </div>

  </aside>

  <!-- CENTER -->

  <main class="story-wrap">

    <div class="story-header">

      <div
        class="pair-render"
        id="pairRender"
      >
        Pair Name
      </div>

      <div
        class="tag-render"
        id="tagRender"
      >
        Relationship
      </div>

    </div>

    <!-- STORY MAP -->

    <div
      class="story-map"
      id="storyMap"
    ></div>

  </main>

  <!-- RIGHT -->

  <aside class="character-side">

    <div class="character-panel">

      <div
        class="profile-image"
        id="profileB"
      ></div>

      <input
        type="file"
        accept="image/*"
        onchange="uploadCharacter(event, 'B')"
      />

      <input
        id="charBName"
        class="character-name"
        placeholder="Character B"
      />

      <textarea
        id="charBBio"
        class="character-bio"
        placeholder="Character introduction"
      ></textarea>

    </div>

  </aside>

</div>

<!-- CREATE / EDIT PANEL -->

<div
  class="editor-panel"
  id="editorPanel"
>

  <div class="editor-top">

    <div class="editor-title">
      EVENT EDITOR
    </div>

    <button
      class="close-btn"
      onclick="closeEditor()"
    >
      ×
    </button>

  </div>

  <input
    id="eventDate"
    placeholder="DATE"
  />

  <input
    id="eventTitle"
    placeholder="TITLE"
  />

  <textarea
    id="eventContent"
    placeholder="Narrative"
  ></textarea>

  <input
    type="range"
    id="eventRelation"
    min="0"
    max="100"
    value="50"
  />

  <input
    type="file"
    accept="image/*"
    id="eventImage"
  />

  <button
    class="create-btn"
    onclick="saveEvent()"
  >
    COMPLETE
  </button>

</div>

<!-- SETTINGS -->

<div class="settings-panel">

  <div class="settings-title">
    THEME
  </div>

  <div class="color-grid">

    <input
      type="color"
      value="#91a2ff"
      onchange="setAccent(this.value)"
    />

    <input
      type="color"
      value="#63ffe9"
      onchange="setAccent2(this.value)"
    />

    <input
      type="color"
      value="#141824"
      onchange="setPanel(this.value)"
    />

  </div>

  <input
    type="file"
    accept="image/*"
    onchange="changeBG(event)"
  />

  <div class="slider-label">
    BLUR
  </div>

  <input
    type="range"
    min="0"
    max="40"
    value="0"
    oninput="setBlur(this.value)"
  />

  <div class="slider-label">
    SCALE
  </div>

  <input
    type="range"
    min="1"
    max="2"
    step="0.01"
    value="1"
    oninput="setScale(this.value)"
  />

  <div class="slider-label">
    ROTATE
  </div>

  <input
    type="range"
    min="-180"
    max="180"
    value="0"
    oninput="setRotate(this.value)"
  />

</div>

<script>

let editIndex = null

let tempImage = ''

let state = JSON.parse(
  localStorage.getItem(
    'pairArchiveData'
  )
) || {

  pairName: '',

  pairTag: '',

  charAName: '',
  charABio: '',
  charAImage: '',

  charBName: '',
  charBBio: '',
  charBImage: '',

  cards: [],

  bg: '',

  blur: 0,

  scale: 1,

  rotate: 0,
}

const storyMap =
  document.getElementById(
    'storyMap'
  )

const bgImage =
  document.getElementById(
    'bgImage'
  )

function save() {

  localStorage.setItem(
    'pairArchiveData',
    JSON.stringify(state)
  )
}

function applyBG() {

  bgImage.style.backgroundImage =
    state.bg
      ? `url(${state.bg})`
      : 'none'

  bgImage.style.filter =
    `blur(${state.blur}px)`

  bgImage.style.transform = `
    scale(${state.scale})
    rotate(${state.rotate}deg)
  `
}

function render() {

  pairName.value =
    state.pairName

  pairTag.value =
    state.pairTag

  pairRender.innerText =
    state.pairName || 'Pair Name'

  tagRender.innerText =
    state.pairTag || 'Relationship'

  charAName.value =
    state.charAName

  charABio.value =
    state.charABio

  charBName.value =
    state.charBName

  charBBio.value =
    state.charBBio

  profileA.style.backgroundImage =
    state.charAImage
      ? `url(${state.charAImage})`
      : 'none'

  profileB.style.backgroundImage =
    state.charBImage
      ? `url(${state.charBImage})`
      : 'none'

  storyMap.innerHTML = ''

  state.cards.forEach(
    (card, index) => {

      const el =
        document.createElement('div')

      el.className =
        'story-card'

      el.innerHTML = `

        <div class="card-date">
          ${card.date || 'DATE'}
        </div>

        <div class="card-title">
          ${card.title || 'TITLE'}
        </div>

        ${
          card.image
          ? `
            <img
              src="${card.image}"
              class="card-image"
            >
          `
          : ''
        }

        <div class="card-content">
          ${
            card.content
              ? card.content.substring(0, 90)
              : 'Narrative'
          }
        </div>
      `

      el.onclick = () => {

        openEdit(index)
      }

      storyMap.appendChild(el)
    }
  )

  applyBG()

  save()
}

function openCreatePanel() {

  editIndex = null

  editorPanel.classList.add(
    'editor-open'
  )

  eventDate.value = ''

  eventTitle.value = ''

  eventContent.value = ''

  eventRelation.value = 50

  tempImage = ''
}

function openEdit(index) {

  const card =
    state.cards[index]

  editIndex = index

  editorPanel.classList.add(
    'editor-open'
  )

  eventDate.value =
    card.date || ''

  eventTitle.value =
    card.title || ''

  eventContent.value =
    card.content || ''

  eventRelation.value =
    card.relation || 50

  tempImage =
    card.image || ''
}

function closeEditor() {

  editorPanel.classList.remove(
    'editor-open'
  )
}

eventImage.onchange = e => {

  const file =
    e.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    tempImage =
      reader.result
  }

  reader.readAsDataURL(file)
}

function saveEvent() {

  const payload = {

    date:
      eventDate.value,

    title:
      eventTitle.value,

    content:
      eventContent.value,

    relation:
      eventRelation.value,

    image:
      tempImage,
  }

  if (
    editIndex === null
  ) {

    state.cards.push(payload)

  } else {

    state.cards[editIndex] =
      payload
  }

  render()

  closeEditor()
}

function uploadCharacter(
  event,
  target
) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    if (target === 'A') {

      state.charAImage =
        reader.result

    } else {

      state.charBImage =
        reader.result
    }

    render()
  }

  reader.readAsDataURL(file)
}

function setAccent(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent',
      color
    )
}

function setAccent2(color) {

  document.documentElement
    .style
    .setProperty(
      '--accent2',
      color
    )
}

function setPanel(color) {

  document.documentElement
    .style
    .setProperty(
      '--panel',
      color
    )
}

function changeBG(event) {

  const file =
    event.target.files[0]

  if (!file) return

  const reader =
    new FileReader()

  reader.onload = () => {

    state.bg =
      reader.result

    render()
  }

  reader.readAsDataURL(file)
}

function setBlur(value) {

  state.blur = value

  applyBG()

  save()
}

function setScale(value) {

  state.scale = value

  applyBG()

  save()
}

function setRotate(value) {

  state.rotate = value

  applyBG()

  save()
}

async function exportPNG() {

  const node =
    document.getElementById(
      'exportBoard'
    )

  try {

    const dataUrl =
      await domtoimage.toPng(
        node,
        {
          quality: 1,
          bgcolor: '#070b14',
          cacheBust: true,
        }
      )

    const link =
      document.createElement('a')

    link.download =
      `${state.pairName || 'pair'}.png`

    link.href =
      dataUrl

    link.click()

  } catch(err) {

    console.error(err)

    alert(
      'PNG export failed'
    )
  }
}

pairName.oninput = e => {

  state.pairName =
    e.target.value

  render()
}

pairTag.oninput = e => {

  state.pairTag =
    e.target.value

  render()
}

charAName.oninput = e => {

  state.charAName =
    e.target.value

  save()
}

charABio.oninput = e => {

  state.charABio =
    e.target.value

  save()
}

charBName.oninput = e => {

  state.charBName =
    e.target.value

  save()
}

charBBio.oninput = e => {

  state.charBBio =
    e.target.value

  save()
}

render()

</script>

</body>
</html>
